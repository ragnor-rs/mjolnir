name: Deploy tree carrier

# What a deploy's tree is held to, read without writing anything. Held to the section of
# plugins/mjolnir/config/schema.md that states the facet; no copy of it is carried here.
#
# A workflow of its own rather than a second job of a sibling, per § 2 of
# plugins/mjolnir/config/schema.md, which states that ruling and the cost it is worth. No copy of
# either is carried here.
#
# ⚠️ This repository states `deploy: []`, so pointed at this tree the carrier finds no target and
# no condition. What this run holds is the carrier's own suite against repositories it builds.

on:
  pull_request:
  push:
    branches: [main]

# No credential of any kind. The suite builds its repositories and their remote in a temporary
# directory; it reaches no host and no tracker.
permissions: {}

jobs:
  deploy-tree-carrier:
    name: Deploy tree carrier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned rather than relying on whatever the runner image ships, for the reason the sibling
      # workflows pin it: the carrier runs on the shared reader, which needs the parser.
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      # One step, one command, and the same string `host.checks` states this run mirrors.
      - name: Hold the deploy tree carrier to the surface
        run: python3 plugins/mjolnir/scripts/deploy_tree.py --self-test

name: Port contract

# The tracker port, held to the contract § 3 of plugins/mjolnir/config/schema.md states: the
# operation list and every absent case are read out of that section, an absent capability
# resolves to the fallback stated there, a status whose writer is not the procedure is refused
# with the writer named, and the trackerless configuration leaves every operation unavailable
# while reporting no fault.
#
# A workflow of its own rather than a second job of a sibling, per § 2: a `host.checks` entry
# states one mirrored command, so two commands behind one workflow name could not be stated on
# the surface at all.

on:
  pull_request:
  push:
    branches: [main]

# No credential of any kind: the contract reads the surface and the examples in the tree, and
# reaches no tracker — which is the one thing a port with no implementation installed certainly
# cannot do.
permissions: {}

jobs:
  port-contract:
    name: Port contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned rather than relying on whatever the runner image ships, for the reason the
      # sibling workflow pins it: the contract runs on the shared reader, which needs the
      # parser, and a check that silently stops running is the failure this job exists to catch.
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      # One step, one command, and the same string `host.checks` states this run mirrors —
      # ⚠️ held together by eye and not by a check, since nothing here reads a workflow file.
      # That is #49.
      #
      # This suite runs each plant beside the assertion it belongs to rather than as a first
      # phase, which is why the step is not named for its plants; the config reader beside it
      # diverges the same way. That divergence is stated where the discipline is, in
      # docs/single-source-of-truth.md, and not in this comment.
      - name: Hold the port contract to the surface and the examples
        run: python3 plugins/mjolnir/scripts/port.py --self-test

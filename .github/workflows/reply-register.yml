name: Reply register

# The register the surface fixes for a role's reply is held in the session, by a `Stop` hook —
# the only place a finished reply exists. So what a gate can hold is the checker itself: that
# every property of the register's table is either held by a check or stated as unheld, and that
# each check still reddens on the violation it was written for. A hook whose checks have quietly
# stopped firing reports green on every reply, which is the failure this run exists to catch.
#
# A workflow of its own rather than a second job of `Checks`, per § 2 of
# plugins/mjolnir/config/schema.md: each mirrored command takes its own workflow where the
# project controls its workflows, because a `host.checks` entry states one mirrored command.

on:
  pull_request:
  push:
    branches: [main]

# No credential of any kind, like its three siblings: the checker reads one file in the tree and
# reaches nothing.
permissions: {}

jobs:
  reply-register:
    name: Reply register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # One step, one command, planted violations first — and the same string `host.checks`
      # declares this run mirrors, so the two cannot drift.
      - name: Assert each check can fail, then hold the register's properties to the surface
        run: python3 plugins/mjolnir/scripts/check_reply_register.py --self-test

name: Adapter suites

# Every installed implementation of the tracker port, held to its own suite. The sibling
# workflow holds the *contract* — the operation list, the absent case, the writer refusal, all
# read out of § 3 of plugins/mjolnir/config/schema.md. What an implementation decides for itself
# is not reachable from there: a cursor followed to the end of a board, an id resolved by name
# rather than written down, a guard that refuses before it writes.
#
# ⛔ One entry rather than one per implementation, and the runner asks the port what is
# installed: a gate entry per tracker would spell a tracker's name in the configuration and
# again in a file name, and plugins/mjolnir/scripts/adapters/ is the one place in this toolkit
# where a tracker's name belongs.
#
# A workflow of its own rather than a second job of a sibling, per § 2: a `host.checks` entry
# states one mirrored command, so two commands behind one workflow name could not be stated on
# the surface at all.

on:
  pull_request:
  push:
    branches: [main]

# No credential of any kind, for the reason the port contract's own workflow states: no case in
# any of these suites performs an operation against a host. Each implementation's suite answers
# every call through the seams the implementation names — the client call and the one probe that
# reads a failure rather than a body — and the live half, which no gate can run, is exercised by
# hand and recorded on the work item. ⚠️ Withholding the credential is the belt to that brace: a
# case that reached the host would fail here instead of reading or writing one.
permissions: {}

jobs:
  adapter-suites:
    name: Adapter suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned rather than relying on whatever the runner image ships, for the reason the
      # sibling workflows pin it: a suite resolves a configuration through the shared reader,
      # which needs the parser, and a check that silently stops running is the failure these
      # jobs exist to catch.
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      # One step, one command, and the same string `host.checks` states this run mirrors —
      # ⚠️ held together by eye, and § 2 rules that it must be: the mapping from a run to the
      # command it mirrors is configured and never inferred. The workflow *name* above is held
      # mechanically, by the `Host checks drift` run.
      - name: Run every installed implementation's suite
        run: python3 plugins/mjolnir/scripts/adapter_suites.py

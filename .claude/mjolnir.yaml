# mjolnir's own configuration.
#
# The toolkit builds itself with itself: every issue here is filed, started, finished and
# reviewed through the loop this repository ships. That is a correctness requirement, not a
# nicety — a procedure whose own repository cannot run it is not finished.
#
# ⚠️ THIS FILE'S VALUES ARE READ, AND NOT EVERY ROLE ACTS ON THEM YET. The shared reader
# (#1) resolves this file, applies the surface's defaults and refuses a configuration the
# surface does not allow — `plugins/mjolnir/scripts/config.py`, held to the examples on
# every change. The tracker behind `kind: github-issues` **is** implemented (#27): the port
# finds its implementation, every operation but the three checklist ones is available, and
# a role that asks for one of those is given the fallback the surface states. What is still
# driven by hand is the loop *around* the port — the roles that would call it are their own
# items. The other readers of this file are the single-source gate, which holds its
# top-level keys to the schema so a key invented here reddens the build, and the
# names-no-project sweep below. ⛔ No count of them is carried: the readers are named where
# they are, and a number here would be wrong by the next one.
#
# ⛔ The repository slug is named here, and it is correct that it is: this is the project's own
# configuration, the same file every adopter writes. It is not the only such place — README.md
# carries the install command and an issue link, and docs/single-source-of-truth.md cites this
# backlog — so the names-no-particular-project guard (#19) excludes this project's own slug
# everywhere, and config/examples/ as example data.
#
# That guard is live as of #19: tools/check_no_project_names.py, and it reads the permitted
# slug out of `host.repo` below rather than carrying one. ⚠️ The exceptions are THREE, not two,
# and they are stated in the script rather than left to a reader — the third turned up in the
# tree while #19 was being built: a public artifact cited as evidence in docs/ is an artifact,
# not a project in scope. That third exception is a table, carrying a reason and the roots each
# entry is permitted in; no count of its entries is written here or in any document.
#
# What survives all three without exception: nothing under a carrier root — skills, commands or
# hooks — carries a value, and no OTHER project is ever named.
roots:
  # One code repository, and the skills root is it — so the single form, which § 1 keeps as the
  # form a project with one repository writes rather than a shape it migrates off.
  code: "."

host:
  kind: github
  repo: "ragnor-rs/mjolnir"
  # ⚠️ The first entry this facet has ever been written for (#47), and the cheapest place to
  # find out whether its shape survives contact with a real workflow. It did not survive
  # unchanged: the first workflow written against it has two triggers, which the single-string
  # form could not state, so the schema now declares a list. `paths` is omitted throughout —
  # none of these workflows filters.
  #
  # Every entry is a workflow of its own rather than a job of another, per § 2. They are listed
  # in the order their files sort under .github/workflows/, so that reading the directory and
  # reading this list give the same sequence; and each workflow's name is the same string as
  # its single job's name, so there is no key here that can be got wrong.
  #
  # ⛔ Every name, trigger and filter below is held to the file that defines it by the `Host
  # checks drift` entry's own run, in both directions: an entry naming no definition and a
  # definition no entry names are each reported. ⚠️ Neither the sort order nor the
  # name-equals-job-name habit is held by it — both are properties of this file rather than
  # rules of the surface, so they stay conventions a reader keeps.
  checks:
    - workflow: "Adapter suites"
      mirrors: "python3 plugins/mjolnir/scripts/adapter_suites.py"
      triggers: ["pull_request -> *", "push -> main"]
    - workflow: "Body sections"
      mirrors: "python3 plugins/mjolnir/scripts/check_body_sections.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    - workflow: "Boundary"
      mirrors: "python3 plugins/mjolnir/scripts/boundary.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    - workflow: "Claim carrier"
      mirrors: "python3 plugins/mjolnir/scripts/claim.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    - workflow: "Config reader"
      mirrors: "python3 plugins/mjolnir/scripts/config.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ Like the two guards below it, what this run holds is the carrier's own suite: no command
    # of this project is named as unbounded and no result limit is stated, so pointed at this tree
    # no *shell call* of this project's reaches a decision and the ones the suite judges are the
    # ones it plants. ⛔ The read arm is the exception and is live here, `reread` below stating
    # `refuse`: a read this session already made is refused in this repository like any other.
    - workflow: "Context guard"
      mirrors: "python3 plugins/mjolnir/scripts/context.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ What this run holds is the bookkeeping corpus and the stream derivations, which is
    # what a gate can hold: whether the deduction still catches every form, whether it
    # discounts an instruction, and whether a sub-window's minutes survive. ⛔ What it cannot
    # hold is a measured day — that needs a store and a history, and the acceptance for it is
    # each project's own total reproduced by hand.
    - workflow: "Day log"
      mirrors: "python3 plugins/mjolnir/scripts/day_log.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ What this run holds is the carrier's own suite and not a verdict about this tree:
    # `e2e_register` below is `none`, so pointed at this project the check says it has no
    # subject and exits without one. The entry is here because the carrier ships from this
    # repository and nothing else would ever assert it.
    - workflow: "End-to-end register"
      mirrors: "python3 plugins/mjolnir/scripts/check_e2e_register.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ The same reading again, on the capacity half: `exclusive_resources` below is `[]`, so the
    # lease arm installs nothing here and this run holds the carrier's suite rather than a verdict
    # about this tree. The merge half *is* live here, and it is live in every session once this
    # lands — which is why the run asserts both fail directions and not only the refusal.
    - workflow: "Enforcement"
      mirrors: "python3 plugins/mjolnir/scripts/enforce.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ The same reading as the entry above: `executed` below is `none`, so this run holds the
    # carrier's own suite rather than a verdict about this tree. No tier here stands a dependency
    # up for a run, which is the only tier § 16 is about.
    - workflow: "Executed count"
      mirrors: "python3 plugins/mjolnir/scripts/executed.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ The one entry of this list whose own run reads the list. Its suite answers from planted
    # configurations rather than from this one, so the circularity is confined to a single
    # assertion — that every entry here states a trigger the consumer can parse, which is the
    # state in which every consumer would report no answer about a run this project really makes.
    - workflow: "Host checks consumer"
      mirrors: "python3 plugins/mjolnir/scripts/host_checks.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ The entry beside it, and the other half of that circularity: this run holds every entry
    # of this facet, its own included, against the files under .github/workflows/. A rename of
    # the workflow above or of the file defining it reddens this run rather than passing it.
    - workflow: "Host checks drift"
      mirrors: "python3 plugins/mjolnir/scripts/check_host_checks.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ What this run holds is the step's own suite and not a verdict about this tree: the step
    # reports what its registry states and writes nothing this project has not asked for. The
    # entry is here because the step ships from this repository and nothing else would ever assert
    # it — and because one arm of that suite inserts an entry into a copy of THIS file, which is
    # the only hand-written configuration in reach of a test. ⛔ No reading of what the registry
    # currently holds is written here: that is one line of the module, and a copy of it in this
    # comment goes stale the day an artifact is registered.
    - workflow: "Installer"
      mirrors: "python3 plugins/mjolnir/scripts/install.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ The destructive carrier, and the reason its entry is worth a sentence: every other run in
    # this list fails by reporting something wrong, while this one can fail by deleting a working
    # tree. What the suite behind it holds is therefore both directions per arm — a must-keep and a
    # must-remove — since a sweep that removes nothing passes a red-side-only check.
    - workflow: "Landed trees"
      mirrors: "python3 plugins/mjolnir/scripts/prune.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ The same reading as the two entries above, on the guard that holds a session: no command
    # in this repository opens one on another machine, so `live_guard` below is `[]` and this run
    # holds the carrier's own suite rather than a verdict about this tree.
    - workflow: "Live guard"
      mirrors: "python3 plugins/mjolnir/scripts/live.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    - workflow: "Names no other project"
      mirrors: "python3 tools/check_no_project_names.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ Why this entry has no `push -> main` arm is stated with the check, in
    # docs/single-source-of-truth.md.
    - workflow: "No audit trail"
      mirrors: "python3 tools/check_no_audit_trail.py --self-test"
      triggers: ["pull_request -> *"]
    # ⚠️ The entry the type clause was added to the surface for, and the one place in this file
    # a clause is written at all: an entry carries one exactly where its workflow states a
    # `types:` key, so the clause's absence above is a reading of those files and not an
    # omission here. ⛔ No count of the entries on either side is carried, for the reason no
    # count of this file's readers is: it would be wrong by the next workflow.
    - workflow: "Nothing deferred"
      mirrors: "python3 tools/check_nothing_deferred.py --self-test"
      triggers:
        - "pull_request(opened, edited, synchronize, reopened, ready_for_review) -> *"
        - "pull_request_review(submitted, dismissed) -> *"
    - workflow: "Port contract"
      mirrors: "python3 plugins/mjolnir/scripts/port.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    - workflow: "Prose width"
      mirrors: "python3 tools/check_prose_width.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    - workflow: "Reply defers nothing"
      mirrors: "python3 plugins/mjolnir/scripts/check_reply_defers_nothing.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    - workflow: "Rules loaded"
      mirrors: "python3 plugins/mjolnir/scripts/load_the_rules.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    - workflow: "Save artifact"
      mirrors: "python3 plugins/mjolnir/scripts/save.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ The counterpart carrier of the entry above, and the one whose suite asserts a **negative**:
    # that every reading it takes creates and removes nothing, with one exception named rather than
    # smoothed over — reading a working tree through git may refresh git's own index, which is git's
    # cache and not the reading's output. ⛔ Not a superlative: the install entry's suite asserts a
    # narrower negative of the same kind, so what is particular here is the scope rather than the
    # shape — a whole fixture tree digested before and after.
    - workflow: "Session restore"
      mirrors: "python3 plugins/mjolnir/scripts/load.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    - workflow: "Single source of truth"
      mirrors: "python3 tools/check_single_source.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    - workflow: "Spend guard"
      mirrors: "python3 plugins/mjolnir/scripts/spend.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
    # ⚠️ The same reading as the entries above whose facet this project does not state:
    # `host.pull_request_title` is absent below, so pointed at this tree the module answers that
    # there is no form and the installer writes no gate. This run holds the derivation against
    # planted forms, which is the only place it can be held — the project the facet was measured
    # on is not this one.
    - workflow: "Title form"
      mirrors: "python3 plugins/mjolnir/scripts/title_form.py --self-test"
      triggers: ["pull_request -> *", "push -> main"]
  # ⛔ No `runner` here, and that absence is the statement § 2 makes it: every workflow above runs
  # on this host kind's own default, which the surface deliberately does not name, so there is
  # nothing to write down. ⚠️ What it costs is stated rather than discovered — the drift run two
  # entries up holds no label, budget or supersession group against any file under
  # .github/workflows/ on this project, and says so at the end of a green run rather than letting
  # the green read as agreement. A project whose account carries its own runners writes the block
  # and gets all three held; this one has one job per workflow on a shared pool and no queue of
  # its own, so every budget here is a run budget and no run of this project's supersedes another.
  # ⛔ No `pull_request_title` here either, and that absence is the statement § 2 makes it: a title
  # in this repository is a sentence and opens with no work-item reference, so the finishing role
  # renders none and the install writes no title gate. ⚠️ The `(#N)` every subject on `main`
  # carries is NOT one: the host appends it to a squashed subject and it is the pull request's
  # number rather than the item's, which is the confusion a key written here on its strength would
  # have made permanent. What the absence costs is stated rather than discovered — nothing holds a
  # title here to anything, and the one check that could have is the one this project does not get.
  # ⚠️ Measured on this repository rather than declared for it (#76), and the measurement is the
  # argument for the key existing at all: `main` is linear, which is equally consistent with
  # squash and with rebase, so every landing before this line picked a method by reading the
  # shape of the history. Squash is what the landings have in fact been, and the evidence is not
  # that shape: a six-commit branch and a three-commit branch each added exactly ONE commit to a
  # `main` carrying no merge commit, which neither a rebase merge nor a merge commit can do.
  # ⚠️ Not the `(#N)` in the subjects — the finishing role passes those itself.
  #
  # ⛔ What the host permits is NOT restated here, per § 2 — and the gap is the point: the host
  # allows all three methods and this project uses one, so a history that drifts is a history
  # nothing on the host refuses. Measured 2026-10-19: `allow_squash_merge`,
  # `allow_merge_commit` and `allow_rebase_merge` are all true.
  #
  # `procedure`, because the host's `delete_branch_on_merge` is false here (measured the same day)
  # and the cleanup after a merge happens on this side — remote ref, local branch and tree. ⚠️ Only
  # the remote ref is this key's; the other two are § 10's release either way. What was a standing
  # convention held by whoever remembered it is a stated fact a role reads as of this line.
  landing:
    method: squash
    delete_branch: procedure

tracker:
  # Plain GitHub issues with no project board — the cheapest real configuration. The gap was
  # found by writing this file, and `config/examples/github-issues.yaml` now covers the kind.
  kind: github-issues
  labels: [role, port, infra, hooks, migration, utility, decision]

work_item:
  type:
    # The labels above classify work by surface rather than by type, and nothing here reads
    # a type. Deliberately absent rather than unset.
    carrier: none
    absent_reason: >-
      Work here is classified by which part of the toolkit it touches, not by bug/feature.
      No skill reads a type, and the branch prefix is taken from the role instead.
  type_branch_prefix:
    role: feature
    port: feature
    infra: feature
    hooks: feature
    migration: feature
    utility: feature
    decision: feature
  estimate:
    carrier: none
    absent_reason: >-
      A solo build with no commitment to anyone outside it. Estimates would be ceremony.
    revisit_when: >-
      A second person takes work from this backlog, or someone outside the build starts
      asking when a given issue lands.
  template:
    carrier: none
    absent_reason: >-
      The backlog was written in one pass against a completed inventory, so every issue
      already states its outcome and its acceptance check. A template would be imposed on
      issues that predate it.
    revisit_when: An issue is filed that states no acceptance check.
  due_date:
    # ⚠️ Absent for the same reason the gating role is unmapped below rather than as a second
    # decision: § 4.5 gives the date one writer, and this project maps no `ready` status for
    # that writer to move an item into. Plain issues have no due-date field either, but that
    # is the weaker of the two reasons and is not the one stated.
    carrier: none
    absent_reason: >-
      Nothing here would write one. There is no gating role to map — a plain issue is open or
      closed, so there is no committed state between them — and the ordering document is what
      this build commits to rather than a date per issue.
    revisit_when: >-
      Someone outside the build starts asking when a given issue lands, which is the same
      trigger the estimate above carries and would be answered by the same role.
  priority:
    # This backlog's own axis, which existed as a convention before it was a key: the two
    # labels are on the host, and what they meant was readable in a person's head and in one
    # project-local script. ⛔ The values are NOT repeated in `tracker.labels` above — that
    # list classifies work by the part of the toolkit it touches, and a second statement of
    # this vocabulary there would be free to disagree with this one.
    carrier: label
    label_prefix: "P: "
    # Two values and no third: nothing below `P: High` is ever set here, so the axis holds
    # these and an issue carrying neither is **unranked** rather than low (§ 4.6). That is
    # load-bearing on this backlog — most issues serve this repository's own loop and are not
    # less important for it.
    values: [Highest, High]
    # `orderer`: a tier here says an external consumer depends on the item, which is a fact
    # about those projects rather than about this one. No role derives it, and the procedure
    # reports the tier it would have suggested instead of writing one.
    writer: orderer

statuses:
  # Two states, and that is the whole vocabulary: a plain issue is open or closed.
  # ⚠️ There is no `in_flight` role here, and an absent role is a legitimate configuration —
  # this repository is the proof of that claim rather than merely its author.
  - { name: "open",   role: initial,  writer: procedure }
  - { name: "closed", role: terminal, writer: automation }

readiness:
  - { check: state_is, roles: [initial], stop: "The issue is already closed." }
  - { check: no_open_blockers, stop: "An issue this one depends on has not landed yet." }

# ⛔ What this repository ships is text and the scripts that hold it, so there is no running
# application for anyone to drive and no `human_verification` to configure: the host's own
# runs in `host.checks` *are* the verification here, and every check below is machine-answered.
# (Not the readiness gate directly above, which answers a different question.) That is the
# behaviour this project already had, written down (§ 13) rather than assumed, and `merged`
# last is what makes the gate block the merge.
# ⚠️ Whether a person is going to look at the diff is a different question and is **not** a
# check here: the reviewing role asks it every pass as procedure, so configuring it would be
# the same ask twice with one of the two allowed to disagree.
done:
  - { check: gate_green, answered_by: procedure,
      stop: "The host's own runs are not green for this commit." }
  - { check: merged, answered_by: procedure,
      stop: "The change has not landed on the integration branch." }

# The stated absence (§ 17), and it is a measurement of this repository rather than a default:
# every check here is mirrored by a workflow above, so a local check would collide with one and
# be refused. Nothing is cached, nothing is stood up for a run, and each check answers about the
# tree it runs in — so there is no verdict that is this side's alone.
checks_local: []

# § 18. Every check above is a verdict that changes nothing — each one reports and repairs
# nothing — so none of them is a command this guard has to be kept off, and `[]` is the
# measurement rather than a key left at its emptiest. ⚠️ `escape` names a variable and never a
# value: setting it to a reason stands one refusal down, which is what keeps a fail-open guard
# from being deleted the first time its evidence is wrong. ⛔ No `operational_when`: nothing in
# this repository owns a probe answering whether the host can run these jobs, so the host's own
# answer is the only one there is and a second implementation would be the duplication this
# toolkit exists to delete.
already_run:
  never_guard: []
  escape: "MJOLNIR_RUN_ANYWAY"

commit:
  # Per role (§ 6), and the same answer for all three here rather than by default: every commit
  # this repository makes rides an item's branch into a pull request, the bookkeeping one
  # included, so there is no role whose commit nobody reviews and nothing to be swept in
  # unnoticed.
  staging:
    session: explicit
    finish: explicit
    review: explicit
  # ⛔ Not read_from_history. The only author is this host's authenticated user; no tool,
  # assistant or generator is credited as author, committer or co-author. See the
  # authorship rule in the schema — it is procedure, not a setting, and `read_from_history`
  # would hand back whatever history happened to carry.
  trailer: none

# § 20. Nothing here is deployed and no role collects a section out of a change, so there is no
# section to require beyond what § 6 already rules and no gate to install. ⛔ The open-items
# section is not an entry here and must not become one: it is procedure's, required of every
# body with no key that turns it off, and an entry of this facet is one a project may stop
# stating.
body_sections: []

carriers:
  day_log: skill
  file: skill
  start: skill
  finish: skill
  review: skill
  session: skill
  # § 24's counterpart of the role above it, mapped here because this project is where the gap it
  # closes was measured: the phrase every one of the surveyed projects' tooling already classified
  # as a bookkeeping turn, with no implementation anywhere.
  load: skill

# § 23. All three thirds: the backlog is this project's own tracker, memory is what a later
# session reads this build's rulings out of, and the commit is § 6's above.
session:
  parts: [tracker, memory, commit]

# § 25. ⛔ `derived` because that is what is true here, and not because pinning is harder: the
# store this project actually refreshes is the agent harness's own per-project directory, whose
# name the harness derives from the absolute path of the working directory. A path written here
# would be a *second* store — one the procedure writes and the harness's own machinery ignores —
# which is two records of one thing allowed to disagree, the defect this whole toolkit deletes.
#
# ⚠️ Measured in this repository rather than reasoned about: with four trees cut from this
# checkout, the harness held a per-project directory for each of them and the store existed under
# the checkout's alone. A save from a tree would have written where the checkout never reads, and
# reported that it succeeded.
#
# What the carrier leaves open is accepted knowingly, and the reader reports each of it — ⚠️ which
# is why this comment names none of them: a list here is a list allowed to disagree with the one
# the reader prints, and it was measured doing exactly that, pricing this carrier at two costs
# while the carrier already left three open.
# `main_tree` is what turns the measurement above into a refusal a role has to name rather than a
# write nobody sees — and it is the only value this carrier allows, the reader refusing the other.
memory:
  carrier: derived
  write_from: main_tree

language:
  work_item: en
  repo: en
  # Measured, not declared: the habit in this tree was already ~100 columns everywhere, and
  # writing it down is what makes it readable by a role rather than by whoever typed last. It
  # governs files here and nothing on the host — a body and a pull request are never wrapped,
  # which is procedure and carries no key. ⚠️ Absence would mean no wrapping at all, so the
  # check below holds nothing if this line is deleted and says so rather than passing.
  prose_width: 100
  artifacts:
    day_log: { language: en, register: technical, audience: "whoever maintains this toolkit" }

day_log:
  day_start: "05:00"
  round_to: 0.5
  round_ties: down
  enforce_grid: true
  streams: [sessions, commits]
  attribute_to: null
  # ⚠️ Measured rather than assumed: every command name in this project's own transcripts is
  # either on the shared closed list or is work — the loop's roles, `close-out` and
  # `adoption-readiness`. Nothing bookkeeping has been retired, so the list is empty, and the
  # reader reports that by name.
  ritual_retired: []
  exclusions: [log_upkeep, rework, overhead]
  sections: billed_only
  evidence:
    # No chat carries this build: it is a solo project with no client thread and no standup, so
    # the `chat` stream is absent above rather than empty here, and the reader reports it.
    chat:
      kind: none
    calendars: []
  # § 26's port. A file under the temp root, which is the kind the default names anyway — written
  # out rather than left implicit because the directory is this project's own and the kind is what
  # the directory belongs to.
  destination:
    kind: file
    out_dir: "$TMPDIR/mjolnir"

branch_model:
  # Measured on this repository rather than declared for it: parallel sessions take a tree each
  # off the primary checkout, which is how rows of the backlog are worked concurrently.
  kind: worktree
  # Each session takes its own tree; the primary checkout is not where an issue's work happens.
  # It is also what the registered marketplace path points at, so leaving it alone keeps it
  # serving the procedure while a branch is in flight beside it.
  work_in_shared_checkout: never
  parallel_trees: true
  # A sibling of the shared checkout rather than a directory inside it: that checkout is the
  # registered marketplace path every session serves, so nesting a per-item tree under it would
  # put one branch's working files inside the path that is supposed to be serving main. The leaf
  # is the item's own number and then its title's slug, derived rather than stated here — § 10.
  tree_dir: "../mjolnir-wt"
  # Null because there is nothing to point at: a tree here needs no dependency install, no asset
  # copy, no port, no container, and nothing to tear down. The cheapest proof that a project
  # whose trees are free to create still has to state the model.
  mechanics: null
  # The two ignored paths a tree here acquires by being worked in, both written again by the next
  # run that needs them: the interpreter's byte-code cache, and the file the desktop drops into
  # any directory somebody opens. ⚠️ `.claude/worktrees/` is deliberately absent even though
  # `.gitignore` names it: a tree a harness cut for a helper is not written back by anything, so a
  # tree still holding one is kept and the path reported rather than removed with it inside.
  regenerable:
    - "__pycache__"
    - ".DS_Store"
  # Nothing contends. The only check this project runs is a python script with no daemon, no
  # service and no machine-wide lock, so no lease is taken and none is synthesised.
  exclusive_resources: []
context:
  artifacts:
    # ⚠️ Measured rather than chosen: the one artifact concurrent sessions here coordinate
    # through is a plan file carried in no configuration and committed nowhere. It sits in the
    # agent harness's own per-project store, beside the session transcripts, while the standing
    # convention that tells a session to read it names a path beside the repository that does
    # not resolve. The file and its pointer disagree, and nothing reports it — which is the
    # absence this facet makes statable.
    carrier: file
    # A choice rather than a constraint, since § 11 offers two legal shapes: this repository
    # keeps per-item working papers out of its history, so `committed` is false — and that is
    # what obliges the store to sit outside every tree, because `kind: worktree` with
    # `work_in_shared_checkout: never` means every item's work happens in a tree that is then
    # removed. ⚠️ The temp-directory hazard § 11 states is accepted here knowingly, and § 24 is
    # where the replay it rests on is stated: a file the session wrote whole replays from the
    # transcript byte for byte, and one it only ever edited does not.
    dir: "$TMPDIR/mjolnir/artifacts"
    committed: false

ordering:
  # ⚠️ The ordering here is a row table in a document that lives in the agent harness's per-project
  # store — outside every tree, and reachable by nothing shipped from the plugin. That is why this
  # facet is a command rather than a tracker query: the command is the project's, the contract on
  # its output is the surface's, and the argument for the order stays in the document beside it.
  carrier: command
  command: "python3 .claude/skills/close-out/scripts/plan-status.py --queue"

people:
  # § 27. One person writes every line here and nobody else takes work from this backlog, so there
  # is no role for a map to distinguish from another: *the dev*, *the owner* and *the reviewer* are
  # one identity, and a map stating that three times would be a map with nothing in it to disagree
  # about. ⛔ Which is why `readiness` above configures no `assignee_matches_role` — the check would
  # compare every item against the only identity there is and pass, which reads as coverage.
  carrier: none
  absent_reason: >-
    A solo build with one identity behind every role. A map would distinguish roles nobody here
    holds separately, and the check that reads one would pass every item for the same reason the
    estimate facet above is ceremony.
  revisit_when: >-
    A second person takes work from this backlog — the same trigger the estimate and the due date
    above carry, and the first point at which who holds a role stops being derivable from the fact
    that there is one of them.

environment:
  # ⚠️ Measured, not declared (#90), and the measurement is the argument for the key: the shell a
  # role runs in here holds forty-odd variables and the procedure reads five of them. Nothing in
  # that shell is a credential — the host's own credential lives in its credential helper rather
  # than in a variable, which is why no token is named below and why writing one in would be the
  # false statement rather than the cautious one.
  #
  # ⛔ Names only. Two paths every command needs, the temp root `day_log.destination.out_dir` and
  # `context.artifacts.dir` are written under, and the two the harness substitutes into a carrier —
  # the plugin's own location, and the per-user directory the reply hook keeps its
  # one-hand-back marker in.
  inherits: [PATH, HOME, TMPDIR, CLAUDE_PLUGIN_ROOT, CLAUDE_PLUGIN_DATA]

e2e_register:
  # ⛔ Nothing here is driven end to end, so there is no suite for a register to describe and no
  # new check in `host.checks` above. What this repository ships is read by a person running a
  # role and by the gates in `tools/`; the thing an end-to-end case would drive — a deployed
  # system behind the interface a person uses — does not exist to be deployed.
  #
  # ⚠️ The facet is still stated, because an unset key and a decided one read alike. The carrier
  # that holds the coverage record for the tiers this repository *does* run is its own gate list:
  # every check carries its planted violations and the workflow runs them before it holds
  # anything, which is a per-check assertion rather than a register of scenarios.
  carrier: none
  absent_reason: >-
    No end-to-end tier: nothing here is deployed and no interface is driven. Every check in this
    repository answers about the tree it runs in, and each carries its own planted violations
    rather than a row in a register.
  revisit_when: >-
    A role is carried by something that has to be stood up before it can be exercised — a service,
    a hosted endpoint, or an install this repository performs rather than describes.

executed:
  # ⛔ No tier here has a dependency the run stands up, which is the only tier § 16 is about. Every
  # check in this repository is its own suite over the tree it runs in: nothing is created for a
  # run and nothing can be absent, so there is no state in which one of them executes zero cases
  # and still exits zero. A declaration and a report would be two commands counting assertions
  # that cannot be skipped.
  #
  # ⚠️ Which is a narrower statement than «the counts would be useless»: they would be readable,
  # and judging them would hold nothing, because the degradation § 16 names is unreachable here.
  carrier: none
  absent_reason: >-
    No tier whose dependency the run stands up: every check here is a suite over the tree it runs
    in, with nothing created for the run and nothing that can be absent, so no run of one can
    execute zero cases and report success.
  revisit_when: >-
    A check here needs something stood up before it can execute — a store, a service, or an
    install this repository performs rather than describes — which is the same trigger the
    end-to-end facet above carries.

spend_guard:
  # ⛔ Nothing here spends. Every command this repository runs is a gate over its own tree: no
  # model provider is called, no tier is metered, and nothing is deployed — so the deny list is
  # empty and the guard is installed and refuses nothing. `[]` rather than an unset key, because
  # a project that decided none of its commands costs money and one that never asked read alike.
  #
  # ⚠️ The empty list is also what makes this repository the green side of its own check: the
  # carrier's suite plants the denials it has to refuse, and the tree it actually runs in is the
  # project that must get no spend hook at all.
  deny: []
  # ⚠️ Stated although the value above makes nothing match it: `approval` is defaulted on the
  # surface, and writing it here says which of the two this project would be under rather than
  # leaving the stricter one to be read in later by somebody who finds the key missing.
  approval: per_invocation
  # No `resume_bar_usd`: a resume here pays to rewrite a prompt cache like any other, and there is
  # no spend beside it for the figure to be worth interrupting a person about. The key is
  # legitimately unset, and the arm that would read it says nothing.

live_guard:
  # ⛔ No command this repository runs opens a session anywhere else. Every check here is a suite
  # over the tree it runs in, the code host is reached by its own client and the tracker through
  # that client too — so there is no machine to be live, and the list is empty. `[]` rather than
  # an unset key, by § 21: a project that looked at its commands and found none that leave this
  # machine and a project that never looked read alike otherwise.
  #
  # ⚠️ The empty list is also what makes this repository the green side of its own check: the
  # carrier's suite plants the session commands it has to hold, and the tree it actually runs in
  # is the project that must get no verdict at all.
  session_tools: []
  # No `allowlist` and no `local_names`: both are read only once an entry above matches, and with
  # no entry there is nothing for either to decide. ⛔ A path stated here would name a file on
  # whatever machine this is checked out on, which is the one thing § 21 keeps outside every
  # working tree.

context_guard:
  # ⛔ No command of this repository's own is named, and that is a measurement rather than a key
  # left at its emptiest: every command a role runs here is a gate over the tree it runs in, and
  # each one prints a verdict whose length is its own suite's business. What is unbounded in a
  # session here belongs to the tools the harness ships rather than to this project, and § 22
  # states a project's own commands.
  #
  # ⚠️ The empty list is also what makes this repository the green side of its own check: the
  # carrier's suite plants the calls it has to refuse and rewrite, and the tree it actually runs
  # in is the project whose shell calls must reach no decision at all.
  unbounded: []
  # ⛔ Nothing is exempt, which is the ordinary configuration with nothing above to be exempt
  # from. The role this facet's exemption exists for is this toolkit's own day log, and ⚠️ it
  # cannot run here at all — `day_log.script` is unset, which the reader already reports — so the
  # command there would be an exemption for a call this project never makes.
  never_bound: []
  # No `result_limit_chars`, so no result is replaced here and none of the roles that read a long
  # evidence file meets a head and a tail in place of it. ⛔ Stated as an absence rather than as a
  # large number: a limit nothing reaches is a limit somebody raises, and the measurement this
  # project has is that its own long results are the ones a role was told to read whole.
  #
  # And no `sidecar_dir`, which § 22 reads only once a limit is stated.
  #
  # ⚠️ Written although it is the surface's default: the arm reads nothing this project knows, so
  # what the key says here is that the default was looked at rather than left to be read in later
  # by somebody who finds it missing.
  reread: refuse

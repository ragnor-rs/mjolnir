# Cards in Jira, code on GitHub — the two axes are independent.
# Deployment is split per environment, and the tracker credential is a person's own
# account, so the procedure may not write status at all.
# Example data — not any project's facts.
roots:
  code: "."
  code_is_own_repo: false

host:
  kind: github
  repo: "OWNER/REPO"
  checks:
    - workflow: "Build"
      mirrors: "<the build command>"
      triggers: "pull_request -> release/*"
  # The release-branch shape: a merge commit, so what landed on a release branch and when is
  # readable off the history itself, and the branches are kept rather than deleted by either side.
  # ⚠️ `never` is a value and not an omission — the host's switch off and the procedure not
  # deleting is a state, and a key with two values would have made somebody always delete.
  landing:
    method: merge_commit
    delete_branch: never

tracker:
  kind: jira
  project_key: "KEY"
  # Transitions are found by name; there is no closing keyword on this tracker.
  transitions: { resolve: by_name }
  capabilities:
    link_for_close: false
    advance_on_merge: true      # an automation off a webhook does it; the procedure must not
  policy:
    forbid_on_item: []

work_item:
  type:
    carrier: native             # a built-in field on this tracker
    values: [Bug, Task, Story, Improvement, Epic, Sub-task]
  type_branch_prefix:
    Bug: fix
    Task: chore
    Story: feat
    Epic: feat
    Sub-task: chore
    # Improvement resolves by whether a user can see the change.
    Improvement: feat|refactor
  estimate:
    carrier: none
    absent_reason: >-
      This project plans with a sprint and a fix version rather than with a per-item number;
      the sprint is what the readiness gate checks.
  template:
    carrier: file
    dir: ".claude/templates"
    by_type:
      Bug: "bug.md"
      Story: "story.md"
    sections:
      outcome: "<this template's own heading>"
      acceptance: "<this template's own heading>"
      reproduction: "<this template's own heading>"
  due_date:
    carrier: none
    absent_reason: >-
      The sprint and the fix version carry the dates here, as they carry the sizing above;
      a date per item would be a second commitment beside the one the sprint already states.

statuses:
  - { name: "<not started>", role: initial,     writer: never }
  - { name: "<in flight>",   role: in_flight,   writer: never }
  - { name: "<code landed>", role: code_landed, writer: automation }
  - { name: "<finished>",    role: terminal,    writer: never }

# writer: never throughout — the credential acts as a person's own account, so every write
# reads as that person speaking. The procedure reports the move it would have made instead.

readiness:
  - { check: field_present, field: "<sprint>", stop: "The item is in no sprint." }
  - { check: field_present, field: "<fix version>", stop: "The item has no fix version." }
  - { check: ref_exists, ref: "<the release branch for that fix version>", stop: "The release branch is missing from the remote." }
  - { check: state_is, roles: [initial, ready], on_fail: flag, stop: "Already started or finished." }

# ⛔ The same "a green gate is not done" rule as github-projects.yaml, split in two because
# its two halves have different answerers (§ 13). The acceptance suite needs the application
# running and is otherwise a machine reading a machine — one command, a pass/fail count, and
# mirrored by no workflow above, which is exactly the check that *must* run locally. The
# checklist on the change needs a person or a browser, and only that half is `human`:
# configuring the suite as human-answered would stop every completion for a hand-over
# nobody needed.
done:
  - { check: gate_green, answered_by: procedure, stop: "The host's runs are not green for this commit." }
  - { check: local, run: "<the acceptance scenario command>", answered_by: procedure,
      stop: "The acceptance scenarios have not been run against a running instance." }
  - { check: checklist_ticked, answered_by: human,
      stop: "Work the checklist on the change and record what you saw." }
  - { check: merged, answered_by: procedure, stop: "The change has not landed." }

commit:
  staging: all
  trailer: read_from_history

carriers:
  day_log: skill
  file: skill
  start: skill
  finish: skill
  review: skill
  deploy: skill                 # split per environment at the project level

language:
  work_item: ru
  repo: en
  artifacts:
    day_log: { language: en, register: business, audience: "the person the hours are reported to" }
    # The branch slug must be a translation of the item title, never a transliteration.

day_log:
  out_dir: "$TMPDIR/<project>"
  day_start: "05:00"
  round_to: 0.5
  round_ties: down
  enforce_grid: true
  script: ".claude/skills/day-report/scripts/active_time.py"
  streams: [sessions, commits, telegram, meetings]
  attribute_to: null
  exclusions: [contractual, log_upkeep, rework, overhead]
  sections: billed_and_not_billed
  evidence:
    chat_patterns: ["<exact chat name>"]
    chat_exclude: []
    mixed_chats: ["<the direct chat that carries both>"]
    calendars: ["<the one calendar whose titles are legible>"]

branch_model:
  # The shape where every item gets its own tree and the shared checkout is never worked in —
  # the alternative to `when_free`, and the reason that is a key rather than a fixed rule.
  kind: worktree
  work_in_shared_checkout: never
  parallel_trees: true
  tree_dir: "../<project>-trees"       # beside the shared checkout; the leaf is the item's key
  mechanics: null                      # a tree here needs nothing installed or copied
  exclusive_resources: []              # nothing local is held; the checks run on the host
context:
  artifacts:
    carrier: file
    # The other legal shape: in-tree, and legal only because it is committed — every item here
    # is worked in a tree that is then removed (`work_in_shared_checkout: never` below), and a
    # teardown takes whatever git does not have. One repository, so the committed plan also
    # arrives in the pull request with the change it plans, which is where a wrong plan is
    # cheapest to catch.
    dir: ".claude/artifacts"
    committed: true

ordering:
  # A saved filter in the tracker, printed as one key per line. The ordering is somebody's
  # judgement either way; what this key settles is where the procedure reads it rather than
  # whether a procedure may compute it.
  carrier: command
  command: "<the command that prints the sprint's ranked issues, one key per line>"

environment:
  # Two variables rather than one: this tracker authenticates as a person, so the credential
  # and the account it belongs to are separate facts and both are read. ⚠️ Which is also why
  # `writer: never` appears throughout this file — the same credential that makes the write
  # possible is what makes it read as that person speaking.
  inherits: [PATH, HOME, TRACKER_API_TOKEN, TRACKER_ACCOUNT]

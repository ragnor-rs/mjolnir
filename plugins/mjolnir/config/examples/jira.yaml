# Cards in Jira, code on GitHub — the two axes are independent.
# Deployment is split per environment, and the tracker credential is a person's own
# account, so the procedure may not write status at all.
# Example data — not any project's facts.
roots:
  code: "."

host:
  kind: github
  repo: "OWNER/REPO"
  checks:
    - workflow: "Build"
      mirrors: "<the build command>"
      triggers: "pull_request -> release/*"
  # This account carries its own runners, so the default label reaches nothing here: a job
  # asking for it never starts at all, which reads as a check that never reports rather than
  # one that fails. ⚠️ The runners take ONE job at a time, which is what makes `budget_minutes`
  # a queue budget — a short job at the back of the line is cancelled having never started, and
  # the number of jobs a workflow splits into is what decides how long that line is.
  runner:
    label: "<the label this account's runners carry>"
    concurrent_jobs: 1
    budget_minutes: 45
    supersedes: "<the group a newer run retires an older one in>"
  # A title here opens with the item's own key, and with more than one where a pull request closes
  # two items at once — which is why `repeated` is a flag and not an assumption: a form encoding
  # exactly one would refuse what the finishing role legitimately writes. ⚠️ This is NOT the
  # closing reference: on this tracker nothing in a title closes anything, and the item moves by
  # the transition above. `into` names the release branches alone, so a pull request into the trunk
  # is held to no title rule at all.
  pull_request_title:
    reference: "[KEY-<number>]"
    repeated: true
    into: ["release/*"]
  # The release-branch shape: a merge commit, so what landed on a release branch and when is
  # readable off the history itself, and the branches are kept rather than deleted by either side.
  # ⚠️ `never` is a value and not an omission — the host's switch off and the procedure not
  # deleting is a state, and a key with two values would have made somebody always delete.
  landing:
    method: merge_commit
    delete_branch: never
  # § 29's port, and the account above is why it matters here: on a single-runner account a run
  # cancelled in the queue and a run that failed share one conclusion word, so `conclusion` is
  # the operation that tells them apart and no consumer reads the word. ⚠️ The `supersedes` group
  # stated above is also what makes the superseded reading reachable at all.
  runs:
    kind: github

tracker:
  kind: jira
  # Two halves of one address, and neither is derivable from the other: the site says which
  # installation answers, the project key says which project within it. ⚠️ The key alone is
  # not an address — every key on a site resolves site-wide, which is also what makes the
  # key the guard an adapter holds a value to.
  site: "https://<site>"
  project_key: "KEY"
  # Transitions are found by name — by the status a transition LEADS TO, which is a separate
  # field from the transition's own name. There is no closing keyword on this tracker.
  transitions: { resolve: by_name }
  # No capability is stated here — schema § 3, `Who declares a capability`.
  policy:
    forbid_on_item: []

work_item:
  type:
    carrier: native             # a built-in field on this tracker
    values: [Bug, Task, Story, Improvement, Epic, Sub-task]
  type_branch_prefix:
    Bug: fix
    Task: chore
    Story: feat
    Epic: feat
    Sub-task: chore
    # Improvement resolves by whether a user can see the change.
    Improvement: feat|refactor
  estimate:
    # A native field on this tracker, holding a duration rather than a free number.
    carrier: field
    unit: hours
    # ⚠️ A closed ladder of size classes and not a number anybody types: each rung maps to
    # hours, and work that is not an item carries a multiplier applied outside the tracker.
    # A project with a ladder wants the ladder validated, which is a different configuration
    # from "a number field" — hence `values` beside the unit.
    values: [1, 2, 4, 8, 24]
    # ⚠️ What the grouping carries is the GATE's business and not this facet's: the readiness
    # list below checks both groupings (§ 4.8), so an item with no estimate still starts.
    # That is a statement about the gate, and a configuration that reads it as the carrier
    # being absent claims a project sizes nothing while its own board sizes nearly every
    # item. Who writes it is § 4.3's question rather than this file's; no role here writes
    # one, so the value arrives by hand.
  template:
    carrier: file
    dir: ".claude/templates"
    by_type:
      Bug: "bug.md"
      Story: "story.md"
    sections:
      outcome: "<this template's own heading>"
      acceptance: "<this template's own heading>"
      reproduction: "<this template's own heading>"
  due_date:
    carrier: none
    absent_reason: >-
      Both groupings carry the dates here, as they carry the sizing above; a date per item
      would be a second commitment beside the one the grouping already states.
  priority:
    carrier: native             # a built-in field on this tracker, as the type above is
    # ⚠️ Stated and ordered even though the tracker owns the field: what the tracker holds is
    # its own, but how two items compare is this surface's (§ 4.6), and an adapter asked to
    # rank the tracker's own words would be inventing the order rather than reading it.
    values: [Highest, High, Medium, Low, Lowest]
    # `never`, for the reason every status below carries it: the credential is a person's own
    # account. The tier is read for the gate and written by nobody here.
    writer: never
  # § 4.8 in its collection form, which is the shape this tracker forced: a time box and a
  # release scope, separate fields with a lifecycle and a closer each, and the readiness list
  # below checks both. ⛔ An entry each, and not one entry with two values — a role asked for
  # the release scope must not be handed the time box because it was written first.
  grouping:
    time_box:
      kind: iteration
      carrier: field
      field: "<the field the time box is held in>"
      # The tracker marks one of these open and dated, so a role reads which one is current
      # rather than being told. ⚠️ The sibling below is the other arm, and that is the whole
      # reason this is a key: the two are the same tracker, one field apart.
      current: discoverable
      # The dates and the sizing hang here (`due_date` above says so), and nothing a change
      # is judged by does — the bar is each item's own.
      has_own_acceptance: false
      # Closing the time box does not close what is still open in it: unfinished items move
      # to the next one, which is why this is a question of its own rather than implied by
      # the closer below.
      closes_items: false
      # `never` throughout, for the reason every status above carries it: the credential is a
      # person's own account, so the procedure reports the close it would have made.
      closed_by: never
    release_scope:
      kind: version
      carrier: field
      field: "<the field the release scope is held in>"
      # Several are open at once here and which one an item goes into is a decision, so no
      # role may read *the current* one — it arrives on the invocation instead.
      current: stated
      has_own_acceptance: false
      closes_items: false
      closed_by: never
      # The branch a release is cut from is named after the scope's own value, which is what
      # `grouping_ref_exists` below reads. ⛔ The prefix and never the whole ref: a ref spelled
      # out here would be one release's and the gate would pass every item after it.
      ref_prefix: "release/"

statuses:
  - { name: "<not started>", role: initial,     writer: never }
  - { name: "<in flight>",   role: in_flight,   writer: never }
  - { name: "<code landed>", role: code_landed, writer: automation }
  - { name: "<finished>",    role: terminal,    writer: never }

# writer: never throughout — the credential acts as a person's own account, so every write
# reads as that person speaking. The procedure reports the move it would have made instead.

# § 4.8's grouping checks, and each names which grouping it asks about because this project
# carries more than one (§ 5). ⛔ No entry below carries the project's own word for a grouping:
# that is what the facet above exists for, and `field_present` naming either of those fields is
# refused by the reader rather than left as a second way to ask the same question.
readiness:
  - { check: in_grouping, grouping: time_box, stop: "The item is in no time box." }
  - { check: in_grouping, grouping: release_scope, stop: "The item is in no release scope." }
  - { check: grouping_ref_exists, grouping: release_scope, stop: "The release branch is missing from the remote." }
  - { check: state_is, roles: [initial, ready], on_fail: flag, stop: "Already started or finished." }

# ⛔ The same "a green gate is not done" rule as github-projects.yaml, split in two because
# its two halves have different answerers (§ 13). The acceptance suite needs the application
# running and is otherwise a machine reading a machine — one command, a pass/fail count, and
# mirrored by no workflow above, which is exactly the check that *must* run locally. The
# checklist on the change needs a person or a browser, and only that half is `human`:
# configuring the suite as human-answered would stop every completion for a hand-over
# nobody needed.
done:
  - { check: gate_green, answered_by: procedure, stop: "The host's runs are not green for this commit." }
  # The check carries no command: `local` reads `checks_local` below for its source (§ 17).
  - { check: local, answered_by: procedure,
      stop: "The acceptance scenarios have not been run against a running instance." }
  - { check: checklist_ticked, answered_by: human,
      stop: "Work the checklist on the change and record what you saw." }
  - { check: merged, answered_by: procedure, stop: "The change has not landed." }

# § 17, carried in full — the facet's complement of `host.checks` above, which mirrors one
# command on release-branch changes only. An entry per verdict, because a verdict is an entry and
# never a second command inside one.
checks_local:
  - command: "<the acceptance scenario command>"
    proves: "the scenarios pass against a running instance of this build"
    # A state to destroy rather than a form of the command above: the instance is torn down and
    # stood up again, or the suite replays its own earlier verdict against code that has moved.
    invalidate: "<the command that tears the instance down>"
    # Presences and a credential — never a version, which no role reads (§ 16's list).
    requires: ["a running instance", "a browser on the machine", "a password for it"]
    # The host mirrors its build on release-branch changes only, so for a change into the main
    # line this verdict is the only verdict there is. Two patterns, hence a list.
    counts_when: ["pull_request -> main", "push -> main"]
  - command: "<the document gate>"
    # Nothing cached and nothing stood up, so neither `invalidate` nor `requires` is written —
    # an absence rather than a key left blank.
    proves: "every document this change touches still describes the tree"
  - command: "<the graded evaluation set command>"
    proves: "the graded set scores at or above the bar this project holds itself to"
    # ⛔ What it needs and nothing about what it costs: the cost is `spend_guard` below, and the
    # fact that it is opt-in is `test_tiers` below that. Three facets, one per question.
    # ⚠️ The budget is deliberately **not** a precondition here: it is a cost, and § 17 blocks a
    # verdict on an unmet precondition and reports an unevaluatable one as undeterminable — so a
    # budget written here would be a `done:` check that can never read green.
    requires: ["a model credential"]
    # ⛔ Without this the entry would be read for every change, because `done:` below carries a
    # `local` check and that check reads every entry of this facet — which would make an opt-in
    # paid tier a condition of finishing anything. The release line is where this project does
    # want it.
    counts_when: ["pull_request -> release/*", "push -> release/*"]

# § 18, and the arm this project is the reason for: it already owns a probe answering whether
# the host can run these jobs — the account's runners are its own, and a suspended one is a
# fact its check tooling reports outside this guard. ⛔ So the guard reads that probe for the
# operational condition rather than growing a second answer to one question; whether a run
# exists, mirrors this command and saw this code is still read from the host.
already_run:
  never_guard: []
  operational_when: "<the probe that prints `operational` where the runners can take a job>"

# § 6. The `all` position on every role that commits: nobody here reads a staged set, so a file
# left out of one is the file that goes missing. ⚠️ It buys no exception to the scan — a
# credential or a client file stops the commit under either value.
commit:
  staging:
    session: all
    finish: all
    review: all
  trailer: read_from_history

# § 20. Two sections, because two roles each read one — and two entries, never one entry naming
# both, since the gate reports a missing section by the heading and the reader waiting on it.
# ⚠️ The headings are in the repository's language and not the tracker's: `language.work_item`
# below is `ru` and `language.repo` is `en`, and the body is a repository artifact.
body_sections:
  - heading: "Before this can be deployed"
    read_by: "the deploy role, per environment"
    nothing_needed: "Nothing."
  - heading: "Data to migrate"
    read_by: "the role that runs the migration ahead of the release"
    nothing_needed: "None."

carriers:
  day_log: skill
  file: skill
  start: skill
  finish: skill
  review: skill
  deploy: skill                 # split per environment at the project level
  session: skill

# § 23. All three thirds stated. ⚠️ The memory third is the one a project on a tracker this far
# from the code would lean on hardest — what the next session needs is rarely on the card.
session:
  parts: [tracker, memory, commit]

# § 25, and the other arm from the one the github-issues example takes: the store here is the
# agent harness's own per-project directory, whose name the harness derives from the absolute path
# of the working directory. ⛔ So the project states that rather than a path, because a path
# composed here would be a second implementation of somebody else's rule — right until that rule
# changes, and silently writing where nothing reads afterwards.
#
# What that costs is stated rather than discovered, and this project accepts all of it — ⚠️ and this
# comment lists none of it, because the reader prints the list for any configuration stating this
# carrier, which is this file: a copy here is a copy allowed to price the carrier differently, and
# that was measured happening.
# And `main_tree` is the only value this carrier allows, which the reader refuses the other half
# of: it is what makes the third refuse from a tree rather than write the tree's own store.
memory:
  carrier: derived
  write_from: main_tree

language:
  work_item: ru
  repo: en
  artifacts:
    day_log: { language: en, register: business, audience: "the person the hours are reported to" }
    # The branch slug must be a translation of the item title, never a transliteration.

day_log:
  day_start: "05:00"
  round_to: 0.5
  round_ties: down
  enforce_grid: true
  streams: [sessions, commits, chat, meetings]
  attribute_to: null
  # A command this project used to have. It is still in the transcripts a past day is
  # backfilled from, so it stays matched for as long as that is true. ⛔ A name and a title,
  # never a pattern: the anchoring is the shared script's, which is what keeps this key from
  # being the route by which the deduction widens onto real work.
  ritual_retired:
    - { command: "deliverables", title: "Generate Monthly Deliverables Report" }
  exclusions: [contractual, log_upkeep, rework, overhead]
  sections: billed_and_not_billed
  evidence:
    # The chat source, named by its kind rather than by its vendor. ⛔ Its address and its
    # thread facets carry no value here at all: this repository sits in the client's organisation,
    # whose rules forbid the names, so every one of them is resolved through `private` below and
    # the keys keep their shape alone. The `kind` stays here because it is this project's rule
    # rather than one of its values, and the agreement with `streams` above is read from it.
    chat:
      kind: telegram_export
      path: null
      patterns: []
      exclude: []
      mixed: []
    calendars: []
  # § 26's port. ⚠️ A worklog on this tracker is **not** what this names: an entry here is one
  # day's hours and description for the whole project, and a worklog hangs off one issue. Which
  # kinds are built is what the port's own directory says.
  destination:
    kind: file
    out_dir: "$TMPDIR/<project>"

branch_model:
  # The shape where every item gets its own tree and the shared checkout is never worked in —
  # the alternative to `when_free`, and the reason that is a key rather than a fixed rule.
  kind: worktree
  work_in_shared_checkout: never
  parallel_trees: true
  # Beside the shared checkout; the leaf is the item's key and then its slug, derived — so a key
  # carrying its own hyphens is the leading half of the leaf rather than a thing to parse back out.
  tree_dir: "../<project>-trees"
  mechanics: null                      # a tree here needs nothing installed or copied
  regenerable: []                      # and so holds nothing a rebuild would write again
  exclusive_resources: []              # nothing local is held; the checks run on the host
context:
  artifacts:
    carrier: file
    # The other legal shape: in-tree, and legal only because it is committed — every item here
    # is worked in a tree that is then removed (`work_in_shared_checkout: never` below), and a
    # teardown takes whatever git does not have. One repository, so the committed plan also
    # arrives in the pull request with the change it plans, which is where a wrong plan is
    # cheapest to catch.
    dir: ".claude/artifacts"
    committed: true

ordering:
  # A saved filter in the tracker, printed as one key per line. The ordering is somebody's
  # judgement either way; what this key settles is where the procedure reads it rather than
  # whether a procedure may compute it.
  carrier: command
  command: "<the command that prints the current time box's ranked issues, one key per line>"

people:
  # § 27's absent case on the tracker that has the most places to put the answer, and the reason is
  # not capability: this project's statuses are written `writer: never` throughout because the
  # credential authenticates as a person, and who holds a role here is decided when the time box
  # above is planned rather than recorded anywhere a procedure can read. ⛔ Stated rather than left
  # unset — a map this project could write and has not is exactly what `revisit_when` is for.
  carrier: none
  absent_reason: >-
    Who holds a role is settled per time box in the planning ceremony and is written down
    nowhere a procedure can be pointed at. The board's assignee is the record of that decision
    rather than a map it could be checked against.
  revisit_when: >-
    The roles outlast a time box, or the gate starts being asked whether an issue is on the
    right person — which is the first reader of a map here that a person is not already.

private:
  # § 28, and the arm it was written for: this repository sits in a client's organisation whose
  # rules forbid the chat names, the calendar and the archive's path on whoever keeps the log —
  # and before this facet existed, the whole of that procedure was git-ignored here for exactly
  # that reason, which is the cost extraction was meant to remove.
  #
  # ⛔ A pointer and a list, never a value: the file below is untracked, and what the tracked
  # half states is which keys it answers. ⚠️ `evidence.chat.path` among them is the one that
  # proves the list is read before requiredness — it is required under this `kind`, and this
  # file carries it nowhere.
  carrier: file
  source: "<the path to this project's own untracked file of those values>"
  keys:
    - day_log.attribute_to
    - day_log.evidence.calendars
    - day_log.evidence.chat.exclude
    - day_log.evidence.chat.mixed
    - day_log.evidence.chat.path
    - day_log.evidence.chat.patterns

loop_exempt:
  # § 30's empty form, which is a statement and not an omission: every change this project makes
  # is filed, gated, started, finished and reviewed, documentation included. ⛔ The reason is this
  # file's own — the statuses are `writer: never` throughout because the credential authenticates
  # as a person, so an item is the only record of what happened, and a commit with no item would
  # be a change nobody can account for at the end of a sprint.
  classes: []
  borderline: ask
  # ⚠️ Null, which is the only value that says nothing here: a branch stated beside an empty class
  # list would be a value nothing routes, and the reader's absent list names that pair where it
  # finds one. With both empty there is nothing to name, which is why this file gets the one line
  # about the class list and no second one about the destination.
  destination: null

environment:
  # Two variables rather than one: this tracker authenticates as a person, so the credential
  # and the account it belongs to are separate facts and both are read. ⚠️ Which is also why
  # `writer: never` appears throughout this file — the same credential that makes the write
  # possible is what makes it read as that person speaking. ⛔ The names are the ones the
  # implementation reads: a list naming only the token would read as complete.
  inherits: [PATH, HOME, JIRA_ACCOUNT, JIRA_API_TOKEN]

e2e_register:
  # The facet carried in full: a suite of journeys, a document that says which journey each case
  # pins, and the two trees a change to behaviour lands in. ⛔ None of the content is here — the
  # journeys, the rows and the reasons are the project's, and what the check holds is whether the
  # three agree. The suite itself is not run by anything this states: it needs a deployment, a
  # credential and money, and this facet is the half that needs the file list and the diff.
  carrier: file
  suite: "qa/journeys"
  # Only the case files, because the suite root also holds the fixtures and the page objects they
  # drive. The naming is the project's own (§ `What earns a test`), which is why it is configured
  # rather than assumed.
  cases: "*.case"
  register: "qa/journeys/COVERAGE.md"
  heading: "Journeys, and the case that pins each one"
  # ⚠️ The escape, and the reason the rule is meetable: a change that genuinely cannot be covered
  # end to end is written down under this heading, in the same document, where the next reader
  # meets it.
  exemptions: "What is deliberately not covered, and why"
  # The two trees a behavioural change lands in. The container and deployment trees are
  # deliberately absent: a change to them passes unremarked and the run says so.
  judged: ["src/app", "src/api"]

executed:
  # The facet carried in full, for the tier that stands its own dependency up: the suite talks to
  # a real store created for the run. ⛔ Which is why this is configured at all — a store that was
  # never created is a condition the runner handles, so the suite skips every case and the command
  # still exits zero. Both values are this project's own commands, ending in whatever § 16's
  # contract asks for.
  carrier: command
  declares: "scripts/count-integration-cases"
  reports: "scripts/run-integration-cases | scripts/as-executed-report"
  # The floor, and the only one § 16 judges. Zero against a non-zero declaration is the failure
  # this project was bitten by; a higher number would be a coverage threshold and is refused.
  min: 1
  # ⚠️ What the skipped cases want, named here so the verdict can say it even when the run says
  # nothing. Whether either precondition *holds* is the local-check facet's and not this one's.
  requires:
    - "a store the run creates for itself, reachable over its own protocol"
    - "the credential that store is created with, in the environment the run inherits"

test_tiers:
  # The facet at its fullest, and the project it was extracted from: three suites that can fail to
  # run, two of them classified under one tier. ⛔ Which is why an entry is a suite rather than a
  # tier — keyed on the tier, this project would have had to state its end-to-end scenarios or its
  # graded set and not both, and they differ in what they need and in whether they start
  # themselves.
  #
  # ⚠️ The unit tier is not a row. It needs only what the build already starts, and § 31 states the
  # list as the suites that need something rather than an inventory.
  carrier: list
  tiers:
    - tier: integration
      # The dependency the **run** stands up — a store created for the run, over its real
      # protocol — which is the other half of the split `stood_up_by` carries, and the tier § 16's
      # arithmetic above is about. ⛔ The two keys are not two statements of one fact: that facet
      # counts what executed, this one says what the suite is.
      needs: [dependency]
      stood_up_by: run
      started: automatic
      selects: "every case under the integration source root, by the suffix that marks the tier"
      # ⛔ Held by the arithmetic above rather than by a second comparison: the declaration counts
      # what the tree holds and the report says what ran, which is what catches a selection that
      # has gone stale in the direction that reports as complete.
      selection_held_by: "scripts/count-integration-cases against the report the run prints"
      # The verdict is the host's own run of this project's build, named and never respelled.
      workflow: "Build"
    - tier: end_to_end
      # ⚠️ The word trap, and the reason the tier word is this surface's and never the project's:
      # this project calls these «the acceptance scenarios», and they are browser-driven against a
      # deployed instance with no person judging them. Filed under the project's own word they
      # would collide with the person-judged tier, which is `checklist_ticked` under `done:` above.
      # ⛔ `money` with them, because the register facet above says so of this same suite: «it
      # needs a deployment, a credential and money». Omitting it here would leave the file stating
      # what the tier needs in two places and disagreeing with itself.
      #
      # ⚠️ And it still starts itself, which is the pairing worth seeing: a need is not a rail.
      # What makes the sibling entry below opt-in is its `started`, and nothing ties `money` to
      # that value — this suite's cost is covered by its own budget and the project runs it on
      # every change.
      needs: [deploy, credential, money]
      started: automatic
      selects: "the journeys the register names, one case file per journey"
      # ⛔ § 15's comparison is this tier's holder **because** the criterion above is the register
      # itself — the condition that section's own rule states. It is named rather than described.
      selection_held_by: "the e2e_register comparison configured above"
      # The target this suite is never run against, and the measured reason: it writes to a real
      # third-party account. ⚠️ A name and nothing more — what a deploy target is remains #63's.
      refused_on: ["<the environment real customers are on>"]
      command: "<the acceptance scenario command>"
    - tier: end_to_end
      # The second suite under the same tier, and the one that costs money: a graded evaluation
      # run against a finite budget. ⛔ `asked` is what makes it opt-in, and the rail that performs
      # the asking is `spend_guard` below — this facet states that the suite is opt-in and keeps no
      # record of its own.
      # ⛔ `deploy` is here because the derivation obliges it for this tier and
      # because it is true: the set is graded against the running instance. What
      # distinguishes this suite from the one above is the other two needs.
      needs: [deploy, material, money]
      started: asked
      selects: >-
        the graded cases whose material the index has caught up on, dropped by the marker each
        case carries when it has not
      # ⛔ No `selection_held_by`, and the cost is stated: nothing compares the marker against the
      # index, so a run that dropped most of the set reports its criterion and not a completeness.
      command: "<the graded evaluation set command>"

spend_guard:
  # The facet at the shape it was extracted from: one runner invokes this project's cheap suites
  # and its paid tier alike, so ⛔ the command decides nothing and the arguments decide everything.
  # Both entries name the same binary and are two entries rather than one pattern, because the
  # costs differ and `reason` is what a refusal names.
  deny:
    - command: "<the runner that runs every tier of this project>"
      args_match: "<the pattern that selects the tier drawing the model quota>"
      reason: "<what one run costs, and what it does to the quota the product shares>"
    - command: "<the runner that runs every tier of this project>"
      args_match: "<the pattern that selects the graded evaluation set>"
      reason: "<what one grading run costs against the budget it draws on>"
  # ⚠️ Per invocation and not per session: the legitimate uses are frequent — the same command,
  # differently scoped, is run deliberately several times a week — so an approval that outlived
  # the call it was given for would be a go for calls nobody saw.
  approval: per_invocation
  # The resume price, which is the one figure the harness states before a turn runs. The bar is
  # this project's own, and it is written here because a resume into the tier above is the cheapest
  # moment to be told what the session is about to cost.
  resume_bar_usd: 0.25

live_guard:
  # The sharp shape of this facet: two commands open a session here, and both are invoked with
  # flags whose value is a separate word. ⛔ That is what `valued_flags` is for — without the
  # flags of *this* project's own commands, the value of one of them stands where the machine
  # should be, and the guard reads a port or a key file as the machine it is about to reach.
  session_tools:
    - command: "<the command that opens a session on another machine>"
      valued_flags: ["--PORT-FLAG", "--IDENTITY-FILE-FLAG"]
    - command: "<the command that copies a file to another machine>"
      valued_flags: ["--PORT-FLAG"]
  # ⚠️ Outside every working tree, and on this project's machines it is the one file a new machine
  # has to be given before the guard stops prompting — which is the half-set-up state § 21 makes
  # stricter rather than silent.
  allowlist: "<the absolute path of the file naming the machines that are not live>"
  # The container this project's own stack is reached by, which never leaves the machine it runs
  # on. ⛔ A name here is a name that denotes *this* machine; every other name belongs in the file
  # above.
  local_names: ["<the name the local stack is reached by>"]

# The sharp shape of § 22: the command no flag of its own bounds, so the refusal names a form to
# run instead rather than rewriting anything — and beside it the exemption, which is what keeps
# this project's own measurement readable.
context_guard:
  unbounded:
    - command: "<the command that prints this project's container logs>"
      # ⛔ A form and not a rewrite: what bounds this one is a pipeline, which is not something a
      # reading of the arguments could derive. The refusal names it, and the session runs it.
      instead: "<the same command piped through a bounding one>"
      reason: "every line since the container started, for a question about the last few"
  # ⛔ The day log's own evidence script, which the role that runs it is forbidden to truncate.
  # ⚠️ **This is what `args_match` is for on this list**: the script is run through an interpreter,
  # so the only command position in the call is the interpreter itself — naming it alone would
  # exempt every call of that language, and the pattern narrows it back to the one script.
  never_bound:
    - command: "<the interpreter `day_log.script` is run through>"
      args_match: "THE-EVIDENCE-SCRIPTS-OWN-FILE-NAME"
  result_limit_chars: 50000
  sidecar_dir: "<the absolute path of a directory outside every working tree>"
  # ⛔ The one arm this project turns off, and the reason is the file rather than the window: a
  # mounted volume restores modification times wholesale here, so a file's own timestamps do not
  # answer whether its content changed since this session read it — and a guard reading them would
  # refuse a read of something new.
  reread: allow

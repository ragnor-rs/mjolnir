# Cards in Jira, code on GitHub — the two axes are independent.
# Deployment is split per environment, and the tracker credential is a person's own
# account, so the procedure may not write status at all.
# Example data — not any project's facts.
roots:
  code: "."
  code_is_own_repo: false

host:
  kind: github
  repo: "OWNER/REPO"
  checks:
    - workflow: "Build"
      mirrors: "<the build command>"
      triggers: "pull_request -> release/*"
  # This account carries its own runners, so the default label reaches nothing here: a job
  # asking for it never starts at all, which reads as a check that never reports rather than
  # one that fails. ⚠️ The runners take ONE job at a time, which is what makes `budget_minutes`
  # a queue budget — a short job at the back of the line is cancelled having never started, and
  # the number of jobs a workflow splits into is what decides how long that line is.
  runner:
    label: "<the label this account's runners carry>"
    concurrent_jobs: 1
    budget_minutes: 45
    supersedes: "<the group a newer run retires an older one in>"
  # A title here opens with the item's own key, and with more than one where a pull request closes
  # two items at once — which is why `repeated` is a flag and not an assumption: a form encoding
  # exactly one would refuse what the finishing role legitimately writes. ⚠️ This is NOT the
  # closing reference: on this tracker nothing in a title closes anything, and the item moves by
  # the transition above. `into` names the release branches alone, so a pull request into the trunk
  # is held to no title rule at all.
  pull_request_title:
    reference: "[KEY-<number>]"
    repeated: true
    into: ["release/*"]
  # The release-branch shape: a merge commit, so what landed on a release branch and when is
  # readable off the history itself, and the branches are kept rather than deleted by either side.
  # ⚠️ `never` is a value and not an omission — the host's switch off and the procedure not
  # deleting is a state, and a key with two values would have made somebody always delete.
  landing:
    method: merge_commit
    delete_branch: never

tracker:
  kind: jira
  project_key: "KEY"
  # Transitions are found by name; there is no closing keyword on this tracker.
  transitions: { resolve: by_name }
  # No capability is stated here — schema § 3, `Who declares a capability`.
  policy:
    forbid_on_item: []

work_item:
  type:
    carrier: native             # a built-in field on this tracker
    values: [Bug, Task, Story, Improvement, Epic, Sub-task]
  type_branch_prefix:
    Bug: fix
    Task: chore
    Story: feat
    Epic: feat
    Sub-task: chore
    # Improvement resolves by whether a user can see the change.
    Improvement: feat|refactor
  estimate:
    carrier: none
    absent_reason: >-
      This project plans with a sprint and a fix version rather than with a per-item number;
      the sprint is what the readiness gate checks.
  template:
    carrier: file
    dir: ".claude/templates"
    by_type:
      Bug: "bug.md"
      Story: "story.md"
    sections:
      outcome: "<this template's own heading>"
      acceptance: "<this template's own heading>"
      reproduction: "<this template's own heading>"
  due_date:
    carrier: none
    absent_reason: >-
      The sprint and the fix version carry the dates here, as they carry the sizing above;
      a date per item would be a second commitment beside the one the sprint already states.

statuses:
  - { name: "<not started>", role: initial,     writer: never }
  - { name: "<in flight>",   role: in_flight,   writer: never }
  - { name: "<code landed>", role: code_landed, writer: automation }
  - { name: "<finished>",    role: terminal,    writer: never }

# writer: never throughout — the credential acts as a person's own account, so every write
# reads as that person speaking. The procedure reports the move it would have made instead.

readiness:
  - { check: field_present, field: "<sprint>", stop: "The item is in no sprint." }
  - { check: field_present, field: "<fix version>", stop: "The item has no fix version." }
  - { check: ref_exists, ref: "<the release branch for that fix version>", stop: "The release branch is missing from the remote." }
  - { check: state_is, roles: [initial, ready], on_fail: flag, stop: "Already started or finished." }

# ⛔ The same "a green gate is not done" rule as github-projects.yaml, split in two because
# its two halves have different answerers (§ 13). The acceptance suite needs the application
# running and is otherwise a machine reading a machine — one command, a pass/fail count, and
# mirrored by no workflow above, which is exactly the check that *must* run locally. The
# checklist on the change needs a person or a browser, and only that half is `human`:
# configuring the suite as human-answered would stop every completion for a hand-over
# nobody needed.
done:
  - { check: gate_green, answered_by: procedure, stop: "The host's runs are not green for this commit." }
  # The check carries no command: `local` reads `checks_local` below for its source (§ 17).
  - { check: local, answered_by: procedure,
      stop: "The acceptance scenarios have not been run against a running instance." }
  - { check: checklist_ticked, answered_by: human,
      stop: "Work the checklist on the change and record what you saw." }
  - { check: merged, answered_by: procedure, stop: "The change has not landed." }

# § 17, carried in full — the facet's complement of `host.checks` above, which mirrors one
# command on release-branch changes only. Two entries, because two verdicts are two entries and
# never two commands in one.
checks_local:
  - command: "<the acceptance scenario command>"
    proves: "the scenarios pass against a running instance of this build"
    # A state to destroy rather than a form of the command above: the instance is torn down and
    # stood up again, or the suite replays its own earlier verdict against code that has moved.
    invalidate: "<the command that tears the instance down>"
    # Presences and a credential — never a version, which no role reads (§ 16's list).
    requires: ["a running instance", "a browser on the machine", "a password for it"]
    # The host mirrors its build on release-branch changes only, so for a change into the main
    # line this verdict is the only verdict there is. Two patterns, hence a list.
    counts_when: ["pull_request -> main", "push -> main"]
  - command: "<the document gate>"
    # Nothing cached and nothing stood up, so neither `invalidate` nor `requires` is written —
    # an absence rather than a key left blank.
    proves: "every document this change touches still describes the tree"

# § 18, and the arm this project is the reason for: it already owns a probe answering whether
# the host can run these jobs — the account's runners are its own, and a suspended one is a
# fact its check tooling reports outside this guard. ⛔ So the guard reads that probe for the
# operational condition rather than growing a second answer to one question; whether a run
# exists, mirrors this command and saw this code is still read from the host.
already_run:
  never_guard: []
  operational_when: "<the probe that prints `operational` where the runners can take a job>"

commit:
  staging: all
  trailer: read_from_history

# § 20. Two sections, because two roles each read one — and two entries, never one entry naming
# both, since the gate reports a missing section by the heading and the reader waiting on it.
# ⚠️ The headings are in the repository's language and not the tracker's: `language.work_item`
# below is `ru` and `language.repo` is `en`, and the body is a repository artifact.
body_sections:
  - heading: "Before this can be deployed"
    read_by: "the deploy role, per environment"
    nothing_needed: "Nothing."
  - heading: "Data to migrate"
    read_by: "the role that runs the migration ahead of the release"
    nothing_needed: "None."

carriers:
  day_log: skill
  file: skill
  start: skill
  finish: skill
  review: skill
  deploy: skill                 # split per environment at the project level

language:
  work_item: ru
  repo: en
  artifacts:
    day_log: { language: en, register: business, audience: "the person the hours are reported to" }
    # The branch slug must be a translation of the item title, never a transliteration.

day_log:
  out_dir: "$TMPDIR/<project>"
  day_start: "05:00"
  round_to: 0.5
  round_ties: down
  enforce_grid: true
  script: ".claude/skills/day-report/scripts/active_time.py"
  streams: [sessions, commits, telegram, meetings]
  attribute_to: null
  exclusions: [contractual, log_upkeep, rework, overhead]
  sections: billed_and_not_billed
  evidence:
    chat_patterns: ["<exact chat name>"]
    chat_exclude: []
    mixed_chats: ["<the direct chat that carries both>"]
    calendars: ["<the one calendar whose titles are legible>"]

branch_model:
  # The shape where every item gets its own tree and the shared checkout is never worked in —
  # the alternative to `when_free`, and the reason that is a key rather than a fixed rule.
  kind: worktree
  work_in_shared_checkout: never
  parallel_trees: true
  # Beside the shared checkout; the leaf is the item's key and then its slug, derived — so a key
  # carrying its own hyphens is the leading half of the leaf rather than a thing to parse back out.
  tree_dir: "../<project>-trees"
  mechanics: null                      # a tree here needs nothing installed or copied
  regenerable: []                      # and so holds nothing a rebuild would write again
  exclusive_resources: []              # nothing local is held; the checks run on the host
context:
  artifacts:
    carrier: file
    # The other legal shape: in-tree, and legal only because it is committed — every item here
    # is worked in a tree that is then removed (`work_in_shared_checkout: never` below), and a
    # teardown takes whatever git does not have. One repository, so the committed plan also
    # arrives in the pull request with the change it plans, which is where a wrong plan is
    # cheapest to catch.
    dir: ".claude/artifacts"
    committed: true

ordering:
  # A saved filter in the tracker, printed as one key per line. The ordering is somebody's
  # judgement either way; what this key settles is where the procedure reads it rather than
  # whether a procedure may compute it.
  carrier: command
  command: "<the command that prints the sprint's ranked issues, one key per line>"

environment:
  # Two variables rather than one: this tracker authenticates as a person, so the credential
  # and the account it belongs to are separate facts and both are read. ⚠️ Which is also why
  # `writer: never` appears throughout this file — the same credential that makes the write
  # possible is what makes it read as that person speaking.
  inherits: [PATH, HOME, TRACKER_API_TOKEN, TRACKER_ACCOUNT]

e2e_register:
  # The facet carried in full: a suite of journeys, a document that says which journey each case
  # pins, and the two trees a change to behaviour lands in. ⛔ None of the content is here — the
  # journeys, the rows and the reasons are the project's, and what the check holds is whether the
  # three agree. The suite itself is not run by anything this states: it needs a deployment, a
  # credential and money, and this facet is the half that needs the file list and the diff.
  carrier: file
  suite: "qa/journeys"
  # Only the case files, because the suite root also holds the fixtures and the page objects they
  # drive. The naming is the project's own (§ `What earns a test`), which is why it is configured
  # rather than assumed.
  cases: "*.case"
  register: "qa/journeys/COVERAGE.md"
  heading: "Journeys, and the case that pins each one"
  # ⚠️ The escape, and the reason the rule is meetable: a change that genuinely cannot be covered
  # end to end is written down under this heading, in the same document, where the next reader
  # meets it.
  exemptions: "What is deliberately not covered, and why"
  # The two trees a behavioural change lands in. The container and deployment trees are
  # deliberately absent: a change to them passes unremarked and the run says so.
  judged: ["src/app", "src/api"]

executed:
  # The facet carried in full, for the tier that stands its own dependency up: the suite talks to
  # a real store created for the run. ⛔ Which is why this is configured at all — a store that was
  # never created is a condition the runner handles, so the suite skips every case and the command
  # still exits zero. Both values are this project's own commands, ending in whatever § 16's
  # contract asks for.
  carrier: command
  declares: "scripts/count-integration-cases"
  reports: "scripts/run-integration-cases | scripts/as-executed-report"
  # The floor, and the only one § 16 judges. Zero against a non-zero declaration is the failure
  # this project was bitten by; a higher number would be a coverage threshold and is refused.
  min: 1
  # ⚠️ What the skipped cases want, named here so the verdict can say it even when the run says
  # nothing. Whether either precondition *holds* is the local-check facet's and not this one's.
  requires:
    - "a store the run creates for itself, reachable over its own protocol"
    - "the credential that store is created with, in the environment the run inherits"

spend_guard:
  # The facet at the shape it was extracted from: one runner invokes this project's cheap suites
  # and its paid tier alike, so ⛔ the command decides nothing and the arguments decide everything.
  # Both entries name the same binary and are two entries rather than one pattern, because the
  # costs differ and `reason` is what a refusal names.
  deny:
    - command: "<the runner that runs every tier of this project>"
      args_match: "<the pattern that selects the tier drawing the model quota>"
      reason: "<what one run costs, and what it does to the quota the product shares>"
    - command: "<the runner that runs every tier of this project>"
      args_match: "<the pattern that selects the graded evaluation set>"
      reason: "<what one grading run costs against the budget it draws on>"
  # ⚠️ Per invocation and not per session: the legitimate uses are frequent — the same command,
  # differently scoped, is run deliberately several times a week — so an approval that outlived
  # the call it was given for would be a go for calls nobody saw.
  approval: per_invocation
  # The resume price, which is the one figure the harness states before a turn runs. The bar is
  # this project's own, and it is written here because a resume into the tier above is the cheapest
  # moment to be told what the session is about to cost.
  resume_bar_usd: 0.25

live_guard:
  # The sharp shape of this facet: two commands open a session here, and both are invoked with
  # flags whose value is a separate word. ⛔ That is what `valued_flags` is for — without the
  # flags of *this* project's own commands, the value of one of them stands where the machine
  # should be, and the guard reads a port or a key file as the machine it is about to reach.
  session_tools:
    - command: "<the command that opens a session on another machine>"
      valued_flags: ["--PORT-FLAG", "--IDENTITY-FILE-FLAG"]
    - command: "<the command that copies a file to another machine>"
      valued_flags: ["--PORT-FLAG"]
  # ⚠️ Outside every working tree, and on this project's machines it is the one file a new machine
  # has to be given before the guard stops prompting — which is the half-set-up state § 21 makes
  # stricter rather than silent.
  allowlist: "<the absolute path of the file naming the machines that are not live>"
  # The container this project's own stack is reached by, which never leaves the machine it runs
  # on. ⛔ A name here is a name that denotes *this* machine; every other name belongs in the file
  # above.
  local_names: ["<the name the local stack is reached by>"]

# A project tracked on GitHub Projects, code and cards on the same host.
# Carries the whole set of roles. Example data — not any project's facts.
roots:
  code: "."

host:
  kind: github
  repo: "OWNER/REPO"
  checks:
    # Keyed by workflow name, never job name — two unrelated workflows may name a job identically.
    - workflow: "CI"
      mirrors: "npm test"
      triggers: "pull_request -> main"
    - workflow: "Lint"
      mirrors: "npm run lint"
      triggers: "pull_request -> main"
      paths: ["src/**", "package.json"]
    # A type clause, and a second event kind as a second member of the list. The clause is
    # stated because this workflow's own `on:` block states a `types:` key; the two entries
    # above omit it because theirs do not, which is the whole of what an omission means.
    - workflow: "Review gate"
      mirrors: "npm run review:gate"
      triggers:
        - "pull_request(opened, edited, synchronize, ready_for_review) -> main"
        - "pull_request_review(submitted) -> main"
    # § 2's second form: one workflow whose jobs mirror a command each, because they share a
    # checkout and a build and the project did not write them to be split. Each job states the
    # filter its own run carries; the workflow's `on:` filter is the entry's, above the list.
    - workflow: "Checks"
      triggers: "pull_request -> main"
      paths: ["docs/**", "schema/**"]
      jobs:
        - job: "docs"
          mirrors: "npm run docs:check"
          paths: ["docs/**"]
        - job: "schema"
          mirrors: "npm run schema:check"
          paths: ["schema/**"]
  # The other half of the same squash habit: the host's switch is off, so the deletion is the
  # finishing role's — the remote ref only, the local branch and the tree being § 10's release.
  landing:
    method: squash
    delete_branch: procedure

tracker:
  kind: github-projects
  project: { owner: "OWNER", number: 0 }
  status_field:
    name: "Status"
    # Option ids are read from the tracker, never copied between skills.
    resolve: by_name

work_item:
  type:
    # A user-owned repository on this host has no native issue types at all,
    # so the type is carried as a label convention.
    carrier: label
    label_prefix: "type:"
    values: [bug, feature, task]
  type_branch_prefix:
    bug: bugfix
    feature: feature
    task: feature
  estimate:
    carrier: none
    absent_reason: >-
      The board has no estimate field, and the process tracks readiness rather than velocity.
      Estimates on a solo build would be ceremony.
    revisit_when: >-
      A second person starts taking items from this board, or someone outside the build begins
      asking when a given item lands.
  template:
    carrier: file
    dir: ".claude/templates"
    by_type:
      bug: "bug.md"
      feature: "feature.md"
      task: "task.md"
    sections:
      outcome: "Outcome"
      acceptance: "Acceptance check"
      reproduction: "Reproduction"
  due_date:
    # A board can hold a date field and this one does not write it: the loop below maps no
    # gating role, and § 4.5 gives the date one writer. A field nothing writes is a column
    # that reads as a commitment while carrying whatever somebody last typed.
    carrier: none
    absent_reason: >-
      No gating role is mapped here, and the date has exactly one writer. Readiness is what
      this board tracks; when an item is due is not a question it answers.
  priority:
    # A board holds a single-select column, which is what `field` names: the tier is a field
    # here rather than a label, so the field is stated and `values` is its options in the
    # board's own order. ⚠️ `field` is the same carrier word § 4.5 offers for a date, under the
    # same rule: a carrier naming a field owes the field's name, or there is nowhere to read.
    carrier: field
    field: "Priority"
    values: [Urgent, High, Medium, Low]
    # `orderer`: the column is set by whoever ordered the work, so the procedure reads the
    # tier and reports the one it would have suggested rather than writing it (§ 4.2).
    writer: orderer

statuses:
  - { name: "Todo",        role: initial,     writer: procedure }
  - { name: "In Progress", role: in_flight,   writer: procedure }
  - { name: "Merged",      role: code_landed, writer: automation }
  - { name: "Done",        role: terminal,    writer: deploy }

readiness:
  - { check: state_is, roles: [initial], stop: "The item is not in the starting state." }
  - { check: no_open_blockers, stop: "An open blocker has to land first." }

# ⛔ A green gate is explicitly not done here, and the reason is structural rather than
# cultural: the whole automated suite above runs in one process against doubles, so the
# user-visible flow is verified by hand or by nothing. The verification sits *before*
# `merged`, which is what makes it block the merge (§ 13) — and because the credential this
# procedure holds drives the application as the application rather than as a user, it can
# hand over a type-this/expect-that script and never produce the answer itself.
done:
  - { check: gate_green, answered_by: procedure, stop: "The host's runs are not green for this commit." }
  - { check: human_verification, answered_by: human,
      stop: "Drive the change in the running application and report what you saw." }
  - { check: merged, answered_by: procedure, stop: "The change has not landed." }

# One local verdict, and the other half of what this project checks: the host mirrors its two
# commands above, and the suite that needs a store stood up is run nowhere but here (§ 17).
checks_local:
  - command: "<the integration suite command>"
    proves: "the suite passes against a store this run stands up"
    requires: ["a container daemon"]

# § 18, and the one arm a project discovers by being refused: the linter above has a fixing
# variant, and the two are told apart by a flag rather than by a name — so the fixing form is
# named here and the guard leaves it alone, the refusal otherwise refusing the repair rather
# than a duplicated verdict. ⚠️ Written as the command's own form, because the match is on the
# command in position and the two forms are two commands.
already_run:
  never_guard: ["npm run lint -- --fix"]
  escape: "SKIP_ALREADY_RUN"

# § 6. One entry per role that commits, and here they agree — which is a decision this project
# states three times rather than a default it inherited once.
commit:
  staging:
    session: explicit
    finish: explicit
    review: explicit
  trailer: read_from_history

# § 20, and the entry names the carrier below it rather than a person: the deploy role reads this
# section out of every change the batch carries, which is the whole membership test.
body_sections:
  - heading: "Before this can be deployed"
    read_by: "the deploy role"
    nothing_needed: "Nothing."

carriers:
  day_log: skill
  file: skill
  start: skill
  finish: skill
  review: skill
  deploy: skill
  session: command              # the whole loop here is commands except where it is not

# § 23. Two thirds: the board is brought current and the work committed, and nothing here keeps
# a memory store for a later session to read.
session:
  parts: [tracker, commit]

# § 25's absent case, and it is the same statement as the list above rather than a second one: the
# reader refuses any disagreement between them. ⚠️ The cost is a cost and not nothing — what a
# later pass here has to re-derive, it re-derives — and this project accepts it because the board
# is where its facts already live.
memory:
  carrier: none
  absent_reason: "Everything a later session needs about an item is on the item's own card, which
    this project's board keeps rich. A store beside it would be a second place to look."

language:
  work_item: en
  repo: en
  artifacts:
    day_log: { language: en, register: business, audience: "the person the work is delivered to" }

day_log:
  day_start: "05:00"
  round_to: 0.5
  round_ties: down
  enforce_grid: true
  streams: [sessions, commits, chat, meetings]
  attribute_to: null
  # Nothing retired here. ⛔ The empty list is the statement.
  ritual_retired: []
  exclusions: [contractual, other_projects, log_upkeep, rework, overhead]
  sections: billed_only
  evidence:
    chat:
      kind: telegram_export
      path: "<the exported archive>"
      patterns: ["<exact chat name>"]
      exclude: []
      mixed: ["<a chat carrying both work and personal talk>"]
    calendars: ["<the one calendar whose titles are legible>"]
  # § 26's port: a file under the temp root, outside the repository the entry is never written
  # into.
  destination:
    kind: file
    out_dir: "$TMPDIR/<project>"

branch_model:
  kind: worktree
  # The shared checkout is worked in when it is free; a tree is taken when it is not.
  work_in_shared_checkout: when_free
  parallel_trees: true
  # The other measured placement: nested under the skills root rather than beside it, which is
  # what a project whose tree carries a second checkout inside it does. A path, never a step —
  # the steps are the pointer below.
  tree_dir: ".worktrees"
  mechanics: ".claude/worktrees.md"   # the tree's own setup and teardown steps
  # The non-empty shape, and the one the pointer above implies: a tree that has something installed
  # into it holds ignored files that running the install again writes back. ⚠️ The environment file
  # the pointer copies in is deliberately absent from this list — a copied secret is written by
  # nothing a rebuild runs, so a tree holding one is kept and the file named.
  regenerable:
    - "<the build output directory>"
    - "<the dependency cache>"
  exclusive_resources:
    # Two resources in one project, with different caps — the shape a single name could not
    # state. The instance is one per project; the build daemon runs two in flight.
    - name: "<the local application instance>"
      cap: 1
      subject: tree
      claimed_by: "<what the command that boots the instance is matched against>"
      probe: "<prints how many instances are up>"
      ttl: 1800
    - name: "<the build daemon's slots>"
      cap: 2
      subject: call
      # The sum schema § 7 states: this probe counts the busy daemons, and a lease younger than
      # `ttl` counts beside it, a build just launched holding no daemon yet. The lifetime is short
      # for the same reason — it covers the launch and nothing more.
      claimed_by: "<what a build command is matched against>"
      probe: "<prints how many daemons are busy>"
      ttl: 120
context:
  artifacts:
    # Research, plan and progress artifacts: what one role hands the next (schema § 11).
    carrier: file
    # Outside every tree, which is the shape for a project that keeps per-item working papers
    # out of its history: `committed: false` with an in-tree path is what § 11 refuses, since
    # a teardown takes whatever git does not have.
    dir: "$TMPDIR/<project>/artifacts"
    committed: false

ordering:
  # The board already holds a rank, so the command is a query against it. What the surface
  # fixes is the output — the takeable items, most takeable first, one identifier per line —
  # and not where the project got the order from.
  carrier: command
  command: "<the command that prints the board's ranked column, one item id per line>"

people:
  # § 27, and the arm that shows the inverse rule: this project carries the map and configures no
  # `assignee_matches_role` in `readiness` above. The gate is one reader of the map rather than its
  # purpose — what reads it here is the role that takes an item and writes an assignee, which
  # writes the identity it resolved instead of whoever is running. ⛔ A pointer and a shape: the
  # file this addresses holds logins and personal names, and neither may enter the toolkit.
  carrier: file
  source: "<the path to the file this project already keeps its role-to-person map in>"
  # The host's own login, which is what `read_item` returns as the person on an item here.
  key: handle

environment:
  # The same host as the example next door, and the opposite decision: the credential stays in
  # the host tool's own credential store and is never exported, so no role inherits it and the
  # list says so. ⚠️ The report is what makes that statement worth writing — a token that turns
  # up in this shell anyway is named by it, which is how a project learns its own drift.
  inherits: [PATH, HOME]

e2e_register:
  # The tier exists and is somebody else's: the suite lives in a repository of its own, driven
  # against a deployed environment on its own schedule. ⚠️ So this project has no case file to
  # compare a register against, and a facet written here would be a record of a suite that is not
  # in this tree — which the file-list comparison would read as a register full of dangling rows.
  carrier: none
  absent_reason: >-
    The end-to-end suite is not in this repository. It runs against a deployed environment from a
    repository of its own, so no case file here could be compared with a register here.
  revisit_when: >-
    A case file lands in this repository, which is the first moment either comparison has two
    lists to make.

executed:
  # The other half of the split § 16 measured: here the **host** supplies the dependency as a
  # service beside the run, so the tier executes there and skips locally. ⚠️ Which is why the
  # facet is carried even though the end-to-end suite above is somebody else's — the tier this is
  # about is the one with a dependency, not the one with a deployment.
  #
  # ⛔ The floor is stated, and this is the configuration that most needs it: the local run has no
  # service beside it, so every case here skips locally and the suite exits zero. Leaving `min`
  # out would read the counts and judge nothing, which is the state this project was bitten in.
  carrier: command
  declares: "scripts/integration-case-count"
  reports: "scripts/integration-run-report"
  min: 1
  requires:
    - "the service the host supplies beside the run, which a local run does not have"

spend_guard:
  # The stricter value, and the configuration it is for: what spends here is a metered deploy, and
  # a go given inside a session is a go for an act that reaches a live environment. ⛔ So no answer
  # in the session releases it — the remedy a refusal names is a person running the command
  # themselves, which is the one route that cannot be taken by a session nobody is watching.
  approval: denied
  deny:
    - command: "<the command that releases to the metered environment>"
      reason: "<what the release costs while it runs, and what it costs to undo>"
  # The resume price is read here too, and the bar is this project's: the window it pays to
  # rewrite is the same window the deploy above is driven from.
  resume_bar_usd: 0.5

live_guard:
  # The same environment the deploy above reaches, guarded one layer lower: the release goes
  # through the command named there, and ⛔ a shell that opens a session on the same machine
  # reaches it without passing any of that. The two are not alternatives — the spend guard holds
  # the release and this one holds every other way onto the box.
  session_tools:
    - command: "<the command that opens a session on another machine>"
      valued_flags: ["--JUMP-HOST-FLAG"]
  allowlist: "<the absolute path of the file naming the machines that are not live>"
  # Nothing is reached without leaving this machine: the environment is the host's, and the local
  # checkout runs no service of its own. ⚠️ Absent rather than empty — no name is read as local,
  # which is the stricter of the two readings.

# The rewriting shape of § 22: both of this project's unbounded commands take a flag that bounds
# them, so neither is refused — the arguments are rewritten and the call runs, and the session is
# told the bound was added.
context_guard:
  unbounded:
    - command: "<the command that prints this project's build log>"
      bound: "--A-LINE-LIMIT-FLAG 200"
      reason: "a full build log is longer than everything else the window holds together"
    # ⚠️ The same command is bounded in one spelling and unbounded in another, which is what
    # `args_match` is for here: a search scoped to a path is already small, and the same search
    # over the whole tree is the call that fills a window.
    - command: "<the command that searches this project's sources>"
      args_match: "(^| )--WHOLE-TREE-FLAG( |$)"
      bound: "--A-MATCH-LIMIT-FLAG 100"
      reason: "every match in the tree, where what was wanted was whether there is one"
  # ⛔ The coverage report is read whole by the role that deploys a batch, which reads it for the
  # one line a head and a tail would cut. Named here rather than left to a reader to notice, the
  # way the mirrored commands above are named rather than inferred. ⚠️ No `args_match`: this
  # command stands in a command position of its own, so the command alone decides.
  never_bound:
    - command: "<the command that prints this project's coverage report>"
  result_limit_chars: 20000
  sidecar_dir: "<the absolute path of a directory outside every working tree>"
  reread: refuse

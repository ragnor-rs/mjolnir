# A deliberately trackerless configuration.
#
# This is the scratch config every skill is proved against: no tracker is configured at all,
# and nothing here may be reported as a broken install. It exists because the next project to
# adopt the toolkit may well have no tracker on its first day, and a skill that crashes on an
# unset value is cheap to prevent now and expensive to discover then.
#
# Example data — not any project's facts.
version: 1

roots:
  code: "."
  code_is_own_repo: false

host:
  kind: github
  repo: "OWNER/REPO"
  # The absent case: the host runs nothing, so every verdict is local. A consumer treats
  # this as "no answer", never as green.
  checks: []

tracker:
  kind: none
  # No block follows. Every tracker operation is unavailable, and the procedure says so
  # plainly and continues with what does not need one: branching, the pull request, the
  # review, the gate, the day log.

work_item:
  type:
    carrier: none
    absent_reason: "There is no tracker to carry a type."
  type_branch_prefix:
    # Still used — a branch needs a prefix whether or not a card exists.
    bug: bugfix
    feature: feature
  estimate:
    carrier: none
    absent_reason: "There is no tracker to carry an estimate, and nothing reads one here."
  template:
    carrier: none
    absent_reason: >-
      With no tracker there is no item body to template. A request is acted on directly, and
      the acceptance check is stated in the pull request instead.

statuses: []
# An empty status list is legitimate. Every role is absent, so the procedure never asks the
# port to advance anything and never reports a missing state as a fault.

readiness:
  # An empty gate is legitimate too: there is no item to gate.
  []

commit:
  staging: explicit
  trailer: read_from_history

carriers:
  day_log: skill

language:
  work_item: en
  repo: en
  artifacts:
    day_log: { language: en, register: technical, audience: "whoever keeps this project's own record" }

day_log:
  out_dir: "$TMPDIR/<project>"
  day_start: "05:00"
  round_to: 0.5
  round_ties: down
  enforce_grid: true
  script: ".claude/skills/day-report/scripts/active_time.py"
  streams: [sessions, commits]
  attribute_to: null
  exclusions: [log_upkeep, rework, overhead]
  sections: billed_only
  evidence:
    chat_patterns: []
    chat_exclude: []
    mixed_chats: []
    calendars: []

branch_model:
  # The in-place case, and the one that makes the dirty-tree derivation (schema § 6) observable:
  # a dirty tree aborts here, because there is no second tree for the branch to be cut in.
  kind: in_place
  # Not read under in_place: there is one checkout, so there is nothing to route.
  work_in_shared_checkout: null
  parallel_trees: false                # one checkout cannot hold two branches
  # Not read under in_place either: no tree is ever created, so there is nowhere to create it.
  tree_dir: null
  mechanics: null
  exclusive_resources: []
context:
  artifacts:
    # The absent case: one mapped role, so nothing is handed from one role to another and
    # there is no boundary for an artifact to cross.
    carrier: none
    absent_reason: >-
      The only mapped role reads evidence and writes its own entry outside the repository.
      No role hands work to another here, so no artifact crosses a boundary.
    revisit_when: A second role is mapped.

ordering:
  # Absent for the reason everything else here is: there is no tracker to hold work, so there
  # is no set of items for an ordering to order. Not a broken install — the one mapped role
  # never asks which item is next.
  carrier: none
  absent_reason: >-
    No tracker is configured, so there is no backlog to order and nothing that could print a
    takeable item.
  revisit_when: A tracker is configured.

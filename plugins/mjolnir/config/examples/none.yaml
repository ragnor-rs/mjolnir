# A deliberately trackerless configuration.
#
# This is the scratch config every skill is proved against: no tracker is configured at all,
# and nothing here may be reported as a broken install. It exists because the next project to
# adopt the toolkit may well have no tracker on its first day, and a skill that crashes on an
# unset value is cheap to prevent now and expensive to discover then.
#
# Example data — not any project's facts.
roots:
  code: "."
  code_is_own_repo: false

host:
  kind: github
  repo: "OWNER/REPO"
  # The absent case: the host runs nothing, so every verdict is local. A consumer treats
  # this as "no answer", never as green.
  checks: []
  # ⚠️ Stated although nothing here reads it: this project maps one role (`day_log` below), so no
  # role of the loop opens a pull request or merges one. § 2 gives this facet no absent case for
  # the reason `repo` and `checks` above have none either — the host block is stated whole, and a
  # project that maps a finishing role later would otherwise inherit the inference the key exists
  # to delete.
  landing:
    method: squash
    delete_branch: never

tracker:
  kind: none
  # No block follows. Every tracker operation is unavailable, and the procedure says so
  # plainly and continues with what does not need one: branching, the pull request, the
  # review, the gate, the day log.

work_item:
  type:
    carrier: none
    absent_reason: "There is no tracker to carry a type."
  type_branch_prefix:
    # Still used — a branch needs a prefix whether or not a card exists.
    bug: bugfix
    feature: feature
  estimate:
    carrier: none
    absent_reason: "There is no tracker to carry an estimate, and nothing reads one here."
  template:
    carrier: none
    absent_reason: >-
      With no tracker there is no item body to template. A request is acted on directly, and
      the acceptance check is stated in the pull request instead.
  due_date:
    carrier: none
    absent_reason: >-
      There is no item to carry a date, and no gating role to write one: the only role mapped
      below is the day log, which measures a day rather than committing to one.

statuses: []
# An empty status list is legitimate. Every role is absent, so the procedure never asks the
# port to advance anything and never reports a missing state as a fault.

readiness:
  # An empty gate is legitimate too: there is no item to gate.
  []

done:
  # The stated absence (§ 13), and the shape every role has to run against: nothing beyond
  # the merge says what finished means here. `gate_green` would name nothing either — the
  # host runs no check above, and `checks_local` below is empty too, so there is no verdict
  # anywhere to read. `[]` rather than an unset key, because a decision and an oversight read
  # identically otherwise.
  []

checks_local:
  # Both halves empty, which is the one pairing worth showing: the host runs nothing (§ 2) and
  # nothing local produces a verdict either (§ 17). The reader reports both and refuses neither
  # — this project maps one role, and that role answers no question about a verdict.
  []

commit:
  staging: explicit
  trailer: read_from_history

carriers:
  day_log: skill

language:
  work_item: en
  repo: en
  artifacts:
    day_log: { language: en, register: technical, audience: "whoever keeps this project's own record" }

day_log:
  out_dir: "$TMPDIR/<project>"
  day_start: "05:00"
  round_to: 0.5
  round_ties: down
  enforce_grid: true
  script: ".claude/skills/day-report/scripts/active_time.py"
  streams: [sessions, commits]
  attribute_to: null
  exclusions: [log_upkeep, rework, overhead]
  sections: billed_only
  evidence:
    chat_patterns: []
    chat_exclude: []
    mixed_chats: []
    calendars: []

branch_model:
  # The in-place case, and the one that makes the dirty-tree derivation (schema § 6) observable:
  # a dirty tree aborts here, because there is no second tree for the branch to be cut in.
  kind: in_place
  # Not read under in_place: there is one checkout, so there is nothing to route.
  work_in_shared_checkout: null
  parallel_trees: false                # one checkout cannot hold two branches
  # Not read under in_place either: no tree is ever created, so there is nowhere to create it.
  tree_dir: null
  mechanics: null
  exclusive_resources: []
context:
  artifacts:
    # The absent case: one mapped role, so nothing is handed from one role to another and
    # there is no boundary for an artifact to cross.
    carrier: none
    absent_reason: >-
      The only mapped role reads evidence and writes its own entry outside the repository.
      No role hands work to another here, so no artifact crosses a boundary.
    revisit_when: A second role is mapped.

ordering:
  # Absent for the reason everything else here is: there is no tracker to hold work, so there
  # is no set of items for an ordering to order. Not a broken install — the one mapped role
  # never asks which item is next.
  carrier: none
  absent_reason: >-
    No tracker is configured, so there is no backlog to order and nothing that could print a
    takeable item.
  revisit_when: A tracker is configured.

environment:
  # The empty list is a real statement and the cheapest one this facet has: the single mapped
  # role reads evidence off the machine and writes a file, so its commands need nothing the
  # shell does not already give every process. ⛔ Not an absent facet — there is no `carrier`
  # here and no `absent_reason`, because the project has stated what it hands a role.
  inherits: []

e2e_register:
  # Nothing is driven end to end here, and the one mapped role produces a file. ⚠️ Stated rather
  # than left unset, which is this file's whole shape: every absence in it carries its reason.
  carrier: none
  absent_reason: >-
    The one mapped role reads evidence off the machine and writes a document. There is no system
    to drive, so there is no suite for a register to describe.
  revisit_when: A role is mapped whose work has to be exercised through an interface.

executed:
  # Nothing is run here that could execute a case, let alone skip one. ⚠️ Stated rather than left
  # unset, which is this file's whole shape: every absence in it carries its reason.
  carrier: none
  absent_reason: >-
    There is no suite and no tier. The one mapped role reads evidence off the machine and writes a
    document, so there is no count of executed cases to declare or to judge.
  revisit_when: A suite is mapped that creates a dependency for itself before it can run.

# Plain GitHub issues: no board, no status field, no `in_flight` role.
# The cheapest real tracker there is, and what a new adopter has on their first day.
# Example data — not any project's facts.
roots:
  code: "."

host:
  kind: github
  # The tracker and the code host are the same system here, and this is the one key
  # that says which repository the items live in.
  repo: "OWNER/REPO"
  checks:
    - workflow: "CI"
      mirrors: "npm test"
      triggers: "pull_request -> main"
  # No `runner` here, and that is the statement rather than a gap: this project's jobs run on
  # the host kind's own default, so there is nothing to write down and nothing holding a
  # workflow file to a label. Compare jira.yaml, whose account carries its own runners — and
  # where the default label would be a check that never reports. What the default *is* lives
  # with the host kind and not on this surface.
  # Squash, with the host's own delete-on-merge switch turned on — so the procedure must not ask
  # for the deletion a second time. ⚠️ That switch is off on a new repository, so `host` here is a
  # project that went and turned it on, which is the point of showing it: the key states who
  # deletes, and a first-day repository with nobody deleting is `never`. What the host *permits*
  # is read from the host and is not restated here — this says only which method is landed by.
  landing:
    method: squash
    delete_branch: host

tracker:
  # ⛔ The kind and nothing else: no board to address, no status field to resolve and no
  # option ids to read. That emptiness is the point — compare github-projects.yaml.
  # Classification rides labels here, and the facet that states which labels is
  # `work_item.type` below, so this block carries no second vocabulary to disagree with it.
  kind: github-issues

work_item:
  type:
    carrier: label
    label_prefix: "type:"
    values: [bug, feature, chore]
  type_branch_prefix:
    bug: bugfix
    feature: feature
    chore: feature
  estimate:
    carrier: none
    absent_reason: >-
      Plain issues have no estimate field, and nothing here is committed to anyone outside
      the build.
    revisit_when: >-
      A second person starts taking work from this backlog, or someone outside it begins
      asking when a given item lands.
  template:
    carrier: file
    dir: ".claude/templates"
    by_type:
      bug: "bug.md"
      feature: "feature.md"
      chore: "feature.md"
    sections:
      outcome: "Outcome"
      acceptance: "Acceptance check"
      reproduction: "Reproduction"
  due_date:
    carrier: none
    absent_reason: >-
      Nothing here would write one: no gating role is mapped below, and the order of the
      backlog is the whole of what this project commits to.
    revisit_when: >-
      The gating role is mapped, which is the only thing on this surface that writes a date.
  priority:
    # The partial axis, which is a shape rather than a half-written configuration: the filing
    # role takes a tier as an argument and writes a label for the top one only, so the axis
    # holds exactly one value and an item without it is **unranked** (§ 4.6) — never read as
    # the lowest. ⚠️ The argument's own middle default is not a value here: nothing is written
    # for it, so nothing on the item carries it and `values` says what the item can hold.
    carrier: label
    label_prefix: "priority:"
    values: [top]
    # The filing role writes the tier it was handed and never one it worked out, which is
    # what `procedure` means on this facet.
    writer: procedure

# ⛔ Two statuses, because an issue has two states and there is no field to carry a third.
# No `in_flight` role at all: nothing on this tracker can hold "someone is working on it",
# which is a legitimate configuration (§ 4.2) rather than a gap to work around. A session's
# claim therefore rides on something else entirely — see #70.
statuses:
  - { name: "open",   role: initial,  writer: procedure }
  # `automation`: the host closes the item itself when a pull request carrying a closing
  # reference merges, so the procedure is refused this move and asks `advance_on_merge`
  # whether it happened.
  - { name: "closed", role: terminal, writer: automation }

readiness:
  - { check: state_is, roles: [initial], stop: "The issue is already closed." }
  - { check: no_open_blockers, stop: "An issue this one depends on has not landed yet." }

# ⛔ The cheapest real definition of done, and what a project that states nothing beyond the
# gate already has: the host's runs green, and the change actually in. Both are the
# procedure's to answer, so no completion here waits on a person — which is a statement
# rather than an omission (§ 13). `merged` last is what makes the gate block the merge.
done:
  - { check: gate_green, answered_by: procedure, stop: "The host's runs are not green for this commit." }
  - { check: merged, answered_by: procedure, stop: "The change has not landed." }

# The stated absence (§ 17): the host above mirrors the one command this project has, so every
# verdict is the host's and there is nothing for a `local` check to read. `[]` rather than an
# unset key, because a decision and an oversight read identically otherwise.
checks_local: []

# § 18, on the first day: the one mirrored command above is a verdict that changes nothing, so
# there is nothing to keep this guard off and `[]` says that rather than leaving the key out.
# No escape and no probe — the host's own answer is the only one this project has.
already_run:
  never_guard: []

# § 6. The measured split, written down: the bookkeeping role stages everything because the
# person asked for the tree as it stands and an unstaged file is simply missing next session,
# while the two roles that commit onto an item's branch name their paths — a swept-in artifact
# there lands in the pull request. ⚠️ `all` is no path filtering and never no scanning.
commit:
  staging:
    session: all
    finish: explicit
    review: explicit
  trailer: read_from_history

# § 20. One section, and it is here because another role reads it: the deploy collects it out of
# every change in the batch and runs what it collected. ⛔ Not a convention — a heading nothing
# collects belongs in a contributing guide rather than behind a gate.
body_sections:
  - heading: "Before this can be deployed"
    read_by: "the role that deploys a batch"
    # The green side, without which every change needing nothing would have to invent something.
    nothing_needed: "Nothing."

carriers:
  day_log: skill
  file: skill
  start: skill
  finish: skill
  review: skill
  session: skill

# § 23. All three thirds stated: the tracker brought current, memory refreshed, then the commit —
# in that order, which is procedure and not this list's. The store that middle third writes is
# § 25's block below, which is written here exactly because this list names the third.
session:
  parts: [tracker, memory, commit]

# § 25. The store pinned, which is the arm that closes the hazard by construction rather than by a
# refusal: the location is stated once, so every tree writes the same store whatever the working
# directory would have derived, and the index is appended under a lock. ⚠️ The path is outside the
# repository on purpose — the facts outlive the item, so the branch model's teardown must not be
# able to reach them, and `committed` has nothing to say about a file in nobody's tree.
memory:
  carrier: path
  # ⚠️ A placeholder, like every other path in this file: a real one here would be a directory on
  # whoever's machine wrote it. § 25 takes an absolute path, a `~`-relative one or a shell variable
  # the role's own command expands — the reader keeps the value as written and expands nothing,
  # which is the shape `day_log.out_dir` below already has. ⛔ Not a temp directory: these facts
  # outlive the work, and a store under one does not outlive a reboot (§ 11).
  store: "<an absolute path outside every working tree>"
  # The one file parallel sessions contend on. The per-fact files beside it are safe under parallel
  # trees, two sessions rarely writing the same fact; this one is read by every session, so two
  # concurrent rewrites of it lose each other.
  index: "index.md"
  # Safe here only because the store above is pinned: with the location stated and the index
  # appended under a lock, a session standing in a tree writes the same store the checkout reads.
  write_from: any_tree

language:
  work_item: en
  repo: en
  # Files here are hard-wrapped, so the width is stated and a role writing a document reads it
  # from here. Bodies and pull requests are never wrapped and carry no key: that is procedure.
  prose_width: 100
  artifacts:
    day_log: { language: en, register: technical, audience: "whoever maintains this project" }

day_log:
  out_dir: "$TMPDIR/<project>"
  day_start: "05:00"
  round_to: 0.5
  round_ties: down
  enforce_grid: true
  script: ".claude/skills/day-report/scripts/active_time.py"
  streams: [sessions, commits]
  attribute_to: null
  exclusions: [log_upkeep, rework, overhead]
  sections: billed_only
  evidence:
    chat_patterns: []
    chat_exclude: []
    mixed_chats: []
    calendars: []

branch_model:
  kind: worktree
  work_in_shared_checkout: never
  parallel_trees: true
  # A sibling of the shared checkout. The leaf is `<number>-<slug>` and is derived, not stated.
  tree_dir: "../<project>-trees"
  mechanics: null
  # Nothing is installed into a tree here, so nothing in one is written again by a rebuild: every
  # ignored file a tree holds is a file a removal would be the only copy of. The stated-empty form,
  # which keeps a tree rather than losing one.
  regenerable: []
  exclusive_resources: []

context:
  artifacts:
    carrier: file
    dir: "$TMPDIR/<project>/artifacts"
    committed: false

ordering:
  # The absent case, and what a new adopter has on their first day: issues in filing order and
  # nothing that says which to take. A role invoked with no item says so and asks for a number.
  carrier: none
  absent_reason: >-
    Plain issues with no board, no rank field and no ordering document. Which item is next is
    decided in conversation, and a list sorted by number would read as an answer.
  revisit_when: >-
    A second person takes work from this backlog, or the issue count passes what one person
    holds in their head.

environment:
  # The host credential in a variable, because the one command this procedure drives against
  # the host reads it from there. ⛔ Names, never values: the value lives in the credential
  # store or the session, and a configuration carrying it would be the leak § 14 exists to
  # prevent.
  inherits: [PATH, HOME, GH_TOKEN]

e2e_register:
  # What a new adopter has on their first day: one workflow running the tests the build already
  # has, and no tier that needs a deployment to exercise. ⛔ The absence is the facet rather than
  # a gap to work around — the key is written, so a project that has decided this and one that has
  # not thought about it do not read alike.
  carrier: none
  absent_reason: >-
    There is no end-to-end tier: the one workflow above runs what the build runs, against nothing
    it has to stand up first. So there are no cases for a register to describe.
  revisit_when: >-
    A case lands that drives the deployed system through the interface a person uses, which is the
    first thing a register would have a row for.

executed:
  # The same first day, one tier down: nothing in the suite the build runs stands a dependency up,
  # so there is no case that can quietly skip and no count that would prove anything. ⚠️ Stated
  # rather than left unset, for the reason the facet above is.
  carrier: none
  absent_reason: >-
    No tier stands a dependency up: the suite the build runs talks to nothing it has to create
    first, so no run of it can skip a case and still report success.
  revisit_when: >-
    A case lands that needs a store, a service or a daemon created for the run — the first moment
    a pass and a run that executed nothing stop reading alike.

spend_guard:
  # The first day again: everything this project runs is free, so nothing is denied. ⚠️ Worth
  # stating even here, because the facet's cheapest failure is a project that acquires a paid
  # suite and never comes back to the key — an empty list is a decision somebody can see has gone
  # stale, while a missing one is a key nobody knew to look for.
  deny: []

live_guard:
  # The first day again, on the other guard: nothing here runs anywhere but this machine, so there
  # is no session command to name. ⚠️ Stated empty for the same reason as the list above — the day
  # this project acquires a machine it deploys to, an empty list is a decision somebody can see has
  # gone stale.
  session_tools: []

# The cheapest half of § 22, and the shape a project has before it has catalogued anything: no
# command list at all, and a size above which any result is replaced by the path its full text was
# written to. ⚠️ The limit needs no knowledge of this project's tooling, which is why it is the arm
# a first day can state — the command list is what grows as somebody notices which call filled a
# window.
context_guard:
  unbounded: []
  never_bound: []
  # Characters, which the key names because a bare number is read in whatever unit its reader
  # assumed.
  result_limit_chars: 20000
  # ⛔ Outside every working tree: a replaced result's full text is the only copy there is, and a
  # path under the checkout is one the branch model's teardown may take with the tree.
  sidecar_dir: "<the absolute path of a directory outside every working tree>"
  # The default, written out: the arm reads nothing this project knows, so the value says the
  # default was looked at rather than left to be read in later by somebody who finds it missing.
  reread: refuse

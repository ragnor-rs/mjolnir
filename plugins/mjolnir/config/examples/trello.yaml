# Cards in Trello, code on GitHub, and the code is TWO separate repositories nested inside the
# repository the skills live in — each under its own owner, git-ignored by the outer one, neither
# a submodule. The code roots differ from the skills root here, which is the case § 1 exists for:
# the skills root is the directory the role runs in, and `code` is stated rather than derived from
# it. There is also more than one of them, which is the case its named roots exist for.
# Example data — not any project's facts.
roots:
  code:
    app:
      path: "<a subdirectory>"
      # The slug and the `checks` beside it travel with the root they describe (§ 1). The outer
      # repository runs nothing, and these two run disjoint sets with no name in common.
      host:
        repo: "APP_OWNER/APP_REPO"      # NOT the outer repository, and not the other root's
        checks:
          - workflow: "Tests"
            mirrors: "<the test command>"
            triggers: "pull_request -> <integration branch>"
    site:
      path: "<another subdirectory>"
      host:
        repo: "SITE_OWNER/SITE_REPO"
        checks:
          - workflow: "Build"
            mirrors: "<the build command>"
            triggers: "pull_request -> <integration branch>"
      # The third axis § 1 carries per root, and the reason it is per root rather than per
      # project: this repository has one long-lived branch and nothing to bring up, so a second
      # tree buys it nothing while the root beside it is cut per card.
      branch_model:
        kind: in_place
        work_in_shared_checkout: null
        parallel_trees: false
        tree_dir: null
        mechanics: null
        regenerable: []
        exclusive_resources: []

host:
  # What both roots share, read by each where its own entry above says nothing (§ 1). ⛔ The slug
  # and the check list are not here, and that is the facet's whole point: they are the two facts
  # that cannot be one answer for two repositories, so a project stating either here would have
  # one root addressed as the other.
  kind: github
  # ⛔ Stated here because this tracker has **no** `link_for_close` (§ 3): nothing on a card closes
  # it when a branch lands, so the title is the only place the pull request says which card it is
  # for, and a reader of the code host has nothing else to follow. ⚠️ A bracketed number and never
  # a hash — `#75` autolinks to issue or pull request 75 in whichever inner repository the change
  # is in, which is an unrelated object, and the card's own number is relative to its board rather
  # than to anything the code host holds.
  pull_request_title:
    reference: "[<number>]"
    repeated: false             # one card per change here; two would read as one scope
    into: ["*"]                 # every pull request, there being one integration branch per root
  # The third method, and one of the facts both inner repositories share rather than one the outer
  # repository holds: the outer one's own settings are read by nothing here (§ 1). A rebase keeps
  # the integration branch linear while rewriting the hashes, which is why § 10's landed reading is
  # written against content rather than ancestry under this value as much as under squash.
  landing:
    method: rebase
    delete_branch: procedure

tracker:
  kind: trello
  board: "<board id>"
  lists:                        # a Trello state is a list
    resolve: by_name
  # No capability is stated here — schema § 3, `Who declares a capability`.
  policy:
    # A third-party service holding someone else's material.
    forbid_on_item: [source_code, credentials, hosting_details, file_paths, branch_names]

work_item:
  type:
    carrier: label
    label_prefix: "T:"
    values: [bug, feature, chore, docs, refactor]
  type_branch_prefix:
    bug: fix
    feature: feat
    chore: chore
    docs: docs
    refactor: refactor
  estimate:
    carrier: label
    label_prefix: "E:"
    unit: hours
    values: [1, 2, 4, 8, 16]
    band: top                   # each rung is the top of a band, not a point value
  template:
    carrier: file
    dir: ".claude/templates"
    by_type:
      bug: "bug.md"
      feature: "feature.md"
    sections:
      outcome: "<this template's own heading>"
      acceptance: "<this template's own heading>"
      reproduction: "<this template's own heading>"
  due_date:
    # The one example that carries a date, and the one that maps a gating role (`carriers`
    # below) — the two go together, § 4.5 giving the date exactly one writer. `native`: the
    # tracker has a due date of its own, so no field is named. The readiness gate below reads
    # it back as the mark that this card has been through the gate.
    carrier: native
  priority:
    # The one example whose gate configures `queue_position` (below), so this is the facet that
    # check reads: it asks whether work ranking above this card is ahead of it, and the ranking
    # is this list's order (§ 4.6). Exactly one label per card and never absent, which is this
    # board's own rule rather than anything the surface states.
    carrier: label
    label_prefix: "P: "
    values: [Expedite, High, Medium, Low]
    # The filing role writes it from its argument. ⚠️ Re-ranking a card already in flight is the
    # orderer's call and no role's — § 4.6 states that as the rule rather than as a second
    # writer here, which is why the key can carry the writer of the first write alone.
    writer: procedure
  code_root:
    # The one example with two code roots above, so the one that has this facet at all — § 4.7
    # refuses it on a project with one root, and requires it here. A fourth prefixed label axis
    # on a board that already carries three, which is what makes `label` the cheap answer here:
    # the tracker has no field to add one to. ⚠️ The mapping is not the identity on purpose — the
    # label is what a person reads on a card and the key is what § 1 names the root by, and a
    # project is free to spell them differently.
    carrier: label
    label_prefix: "R: "
    roots:
      app: "<the label this board puts on a card whose code is the app's>"
      site: "<the label this board puts on a card whose code is the site's>"
    # ⛔ No `writer` key: § 4.7 carries none, and § 4.6's rules reach this value as written —
    # no role derives it, and a value already on the card is never rewritten.

statuses:
  - { name: "<backlog>",     role: initial,     writer: procedure }
  - { name: "<gated>",       role: ready,       writer: procedure }
  - { name: "<in flight>",   role: in_flight,   writer: procedure }
  - { name: "<code landed>", role: code_landed, writer: automation }
  - { name: "<published>",   role: deployed,    writer: deploy }
  - { name: "<approved>",    role: accepted,    writer: orderer }
  - { name: "<finished>",    role: terminal,    writer: deploy }
  - { name: "<dropped>",     role: dropped,     writer: procedure }

readiness:
  - { check: state_is, roles: [ready], stop: "The item has not been gated into committed work." }
  - { check: field_present, field: "<due date>", stop: "No due date." }
  - { check: field_present, field: "<estimate label>", stop: "No estimate." }
  - { check: label_absent, label: "<incomplete>", stop: "The item is marked incomplete." }
  - { check: no_open_blockers, stop: "An open blocker has to land first." }
  - { check: assignee_matches_role, stop: "The assignee does not match the role on the item." }
  - { check: queue_position, ahead_allowed: 0, on_fail: stop_quietly, stop: "Higher-priority work is ahead of this in the queue." }
  # § 4.7, and § 5 requires the entry of any project carrying that facet: the last point before a
  # claim is taken, where the two repositories above are still a question rather than a branch.
  - { check: code_root_stated, stop: "The card does not say which repository the work is in." }

# ⛔ A person-answered check on the tracker with the fewest places to put the answer. There is
# no comment action here, and `policy.forbid_on_item` above bars branch names from the card
# anyway, so the record of who verified what goes on the **change**, in whichever inner repository
# it is in — which satisfies what § 13 asks of the record: somewhere other than a role's own reply,
# which nothing downstream can read.
done:
  - { check: gate_green, answered_by: procedure, stop: "The runs of the repository this change is in are not green for this commit." }
  - { check: human_verification, answered_by: human,
      stop: "Drive the change by hand and record on the change what you saw." }
  - { check: merged, answered_by: procedure, stop: "The change has not landed." }

# The stated absence (§ 17). Each inner repository's workflow mirrors the one command it has,
# and the hand-driven check above is a person's rather than a command — so there is no local
# verdict to state, and `[]` says that rather than leaving the key out.
checks_local: []

# § 18. The escape on its own, with nothing exempt: the one mirrored command is a verdict, and
# what this project wanted was a way past a refusal on the day the host's evidence is wrong.
# ⛔ A name and never a value — the person sets it to the reason, and a blank value is no reason.
already_run:
  never_guard: []
  escape: "RUN_IT_ANYWAY"

commit:
  staging: explicit
  trailer: read_from_history

# § 20's stated absence. This project deploys from a branch and nothing collects a section out of
# a change, so there is no section to require and no gate to install. `[]` rather than an unset
# key, for the reason `checks_local` above is written that way.
body_sections: []

carriers:
  day_log: skill
  file: skill
  gate: skill                   # filing and gating are two roles here
  start: skill
  finish: skill
  review: skill
  deploy: skill

language:
  work_item: ru
  repo: en
  # No `prose_width`, which is the commoner habit and an answer rather than an omission: this
  # project does not hard-wrap its files, so a role leaves the paragraphs it writes unwrapped.
  artifacts:
    day_log: { language: en, register: business, audience: "the person the hours are reported to" }

day_log:
  out_dir: "$TMPDIR/<project>"
  day_start: "05:00"
  round_to: 0.1                 # this project states one decimal, so the grid is not asserted
  round_ties: down
  enforce_grid: false
  script: ".claude/skills/day-report/scripts/active_time.py"
  streams: [sessions, commits, telegram, meetings]
  attribute_to: null
  exclusions: [contractual, log_upkeep, rework, overhead]
  extra_exclusions:
    - name: off_plan
      rule: >-
        Only work that advances a row of one of the agreed plans is billed. Work around a plan
        item counts as the item; work the plans never asked for leaves the total even when it
        was worth doing.
  sections: billed_and_not_billed
  evidence:
    chat_patterns: ["<exact chat name>"]
    chat_exclude: []
    mixed_chats: []
    calendars:
      - "<the calendar whose titles are legible>"
      - "<a free-busy calendar: times only, no titles>"

branch_model:
  # The project's own, read by the root whose entry above states nothing of its own (§ 1) — here
  # that is `app`. The tree pairs with that nested code checkout, so both halves are cut per card
  # and the outer one carries the cwd. Where a tree goes is `tree_dir`; what must be copied into it
  # before the stack's first boot is the pointer's — not the shared procedure's.
  kind: worktree
  work_in_shared_checkout: when_free
  parallel_trees: true
  tree_dir: "../<project>-trees"
  mechanics: ".claude/worktrees.md"
  # The stack writes its own volumes and logs into the tree, and bringing it up again writes them
  # back. The material the pointer copies in is not here, for the reason the removal is destructive
  # at all: nothing a rebuild runs would put it back.
  regenerable:
    - "<the stack's own volume directory>"
    - "<the log directory>"
  exclusive_resources:
    # One stack for the whole project, and the ticket belongs to the tree: two sessions in one
    # tree share a place, two trees queue against each other.
    - name: "<the local service stack>"
      cap: 1
      subject: tree
      claimed_by: "<what the command that brings the stack up is matched against>"
      # The stated absence: nothing here can be asked how many stacks are up, so the leases are
      # the whole of the count and the lifetime has to cover the work rather than the launch.
      probe: null
      ttl: 3600
context:
  artifacts:
    carrier: file
    # The nested-repository case, and the reason `committed: true` is not simply "the plan is in
    # the pull request": every `.claude/…` path here resolves in the OUTER repository, while the
    # branches and pull requests belong to whichever inner one the work is in (§ 1). Committing
    # the plan would file it beside the engagement material and not in front of a reviewer, so
    # this store sits outside every tree instead.
    dir: "$TMPDIR/<project>/artifacts"
    committed: false

ordering:
  # A list on the board is the queue, read top to bottom. ⚠️ This project's readiness gate also
  # configures `queue_position` (§ 5) — the gate asks whether this card is far enough forward,
  # and this says which card to offer. One statement of the order, read by two roles.
  carrier: command
  command: "<the command that prints the queue list top to bottom, one card id per line>"

environment:
  # A key and a token as a pair, which is how this tracker is addressed: one credential is two
  # variables here, and a list that named only the token would read as complete. ⚠️ The project
  # whose `policy.forbid_on_item` above bars credentials from ever reaching a card is the same
  # project that has to say which credentials its roles hold — the write side and this one are
  # the same boundary from opposite directions.
  # ⛔ These two names are the implementation's own and not placeholders: the adapter behind
  # `kind: trello` reads exactly them, so a project that renames them here hands its roles a shell
  # the adapter cannot address — which comes back as a failed operation naming both, never as a
  # capability this tracker lacks.
  inherits: [PATH, HOME, TRELLO_KEY, TRELLO_TOKEN]

e2e_register:
  # ⚠️ The decision rather than the absence of one: this project drives the tier by hand, and
  # `human_verification` under `done:` above is where that answer is recorded. A person's walk
  # through the change leaves no case file, so there is no file list for anything here to compare.
  carrier: none
  absent_reason: >-
    The tier is driven by hand and recorded through the `human_verification` check above. Nothing
    is written to a case file, so there is no suite and no register to hold together.
  revisit_when: >-
    The walk-through is automated into case files, which is the first moment a record of what is
    covered has two lists to be held between.

executed:
  # ⚠️ A different absence from the one above, and the two are not interchangeable: the tier there
  # is driven by hand, while here there is no tier of this kind at all. A person walking a change
  # cannot silently execute nothing — they would notice — so the degradation § 16 names has no
  # route into this project.
  carrier: none
  absent_reason: >-
    There is no tier whose dependency a run stands up. What exists is a person's walk-through,
    recorded through the `human_verification` check above, which cannot execute zero cases
    unnoticed.
  revisit_when: >-
    A suite lands that creates something for itself before it can run — a store, a service or a
    daemon — which is the same trigger the facet above carries.

spend_guard:
  # The simplest shape the facet has: one command that spends, named, with no pattern beside it.
  # ⚠️ The command alone decides here because the script does nothing else — which is exactly the
  # case the sibling example next door does not have, and the reason `args_match` is a key rather
  # than part of the command.
  deny:
    - command: "<the script whose every invocation spends>"
      reason: "<what one invocation costs, in this project's own terms>"
  # Left at the default, written out: the person who drives the tier by hand is the same person
  # this ask reaches, and they run it deliberately rather than rarely.
  approval: per_invocation

live_guard:
  # The simplest shape this facet has: one command that opens a session, named, with no flag list
  # beside it because the form this project writes carries the machine as its first word.
  session_tools:
    - command: "<the command that opens a session on another machine>"
  # ⛔ Outside every working tree, which is the whole point: this repository carries the mechanism
  # and the machine carries the names. A path under the checkout would put somebody's
  # infrastructure in the history of a repository anybody can clone.
  allowlist: "<the absolute path of the file naming the machines that are not live>"
  # The names that reach nothing: a loopback name is not another machine's identity, which is the
  # test that decides which of these two lists a name belongs in.
  local_names: ["<the loopback name this project's own services are reached by>"]

# § 22 where the roots differ, and that is what sharpens one key of it: the code is two separate
# repositories nested inside this one, so a sidecar written under any of the three checkouts
# lands in a tree somebody's branch model may take — and in an inner one it would land in a
# directory the outer repository ignores, where nothing would ever notice it again.
context_guard:
  unbounded:
    - command: "<the command that prints this project's dependency tree>"
      bound: "--A-DEPTH-FLAG 1"
      reason: "every transitive dependency, for a question about the direct ones"
  never_bound: []
  result_limit_chars: 20000
  # ⛔ Outside all three repositories, not merely outside the one the change is in.
  sidecar_dir: "<the absolute path of a directory outside every checkout>"
  reread: refuse
